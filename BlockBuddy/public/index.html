<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BlockBuddy — Scratch AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='10' y='10' width='80' height='80' rx='18' fill='%23f59e0b'/><text x='50' y='68' font-size='48' text-anchor='middle' fill='%23111827' font-family='sans-serif' font-weight='bold'>B</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117; --bg2: #161922; --panel: #1c202b; --line: #2a3040; --line2: #343b4f;
    --text: #e8eaf0; --mut: #8b93a7; --accent: #f59e0b; --accent-dim: rgba(245,158,11,.14);
    --blue: #3b82f6; --red: #ef4444;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; font-size: 15px;
  }
  header {
    background: var(--bg2); border-bottom: 1px solid var(--line);
    padding: 0 22px; height: 54px; display: flex; align-items: center; gap: 14px;
    position: sticky; top: 0; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: .98rem; letter-spacing: -.01em; }
  .brand .mark {
    width: 26px; height: 26px; border-radius: 7px; background: var(--accent); color: #111827;
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: .85rem;
  }
  .brand .sub { color: var(--mut); font-weight: 500; font-size: .8rem; margin-left: 2px; }
  header .spacer { flex: 1; }
  .btn {
    font-family: inherit; font-weight: 600; font-size: .82rem; cursor: pointer;
    background: transparent; color: var(--mut); border: 1px solid var(--line2); border-radius: 8px;
    padding: 7px 14px; transition: color .15s, border-color .15s;
  }
  .btn:hover { color: var(--text); border-color: var(--mut); }

  #chat { flex: 1; overflow-y: auto; }
  .inner { max-width: 760px; margin: 0 auto; padding: 28px 20px 12px; display: flex; flex-direction: column; gap: 14px; }

  .msg { display: flex; gap: 12px; }
  .who {
    flex: none; width: 30px; height: 30px; border-radius: 8px; margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    font-size: .68rem; font-weight: 700; letter-spacing: .02em;
  }
  .msg.user .who { background: var(--line); color: var(--mut); }
  .msg.buddy .who { background: var(--accent); color: #111827; }
  .body { flex: 1; min-width: 0; padding-top: 5px; line-height: 1.65; }
  .msg.user .body { color: var(--mut); font-weight: 500; }
  .body p { margin: 8px 0; }
  .body p:first-child { margin-top: 0; }
  .body p:last-child { margin-bottom: 0; }
  .body ul, .body ol { margin: 8px 0 8px 22px; }
  .body li { margin: 4px 0; }
  .body h1, .body h2, .body h3 { font-size: .95rem; font-weight: 700; margin: 14px 0 4px; }
  .body strong { color: #fff; }
  .body code {
    font-family: 'JetBrains Mono', monospace; font-size: .82em;
    background: var(--panel); border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px;
  }
  .body pre.plain {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; overflow-x: auto; margin: 10px 0;
  }
  .body pre.plain code { background: none; border: none; padding: 0; font-size: .8rem; }
  .blockswrap {
    background: #f6f8fa; border: 1px solid var(--line2); border-radius: 10px;
    padding: 14px 16px; margin: 10px 0; overflow-x: auto;
  }
  .blockswrap svg { max-width: none; display: block; }
  .body pre.blocks-raw {
    font-family: 'JetBrains Mono', monospace; font-size: .78rem; color: var(--mut);
    background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent);
    border-radius: 10px; padding: 12px 14px; overflow-x: auto; margin: 10px 0;
  }
  .typing { display: inline-flex; gap: 4px; padding: 6px 0; }
  .typing i { width: 6px; height: 6px; background: var(--mut); border-radius: 50%; animation: fade 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes fade { 40% { opacity: .25; } }

  .hello { padding: 64px 10px 22px; text-align: center; }
  .hello .mark {
    width: 46px; height: 46px; border-radius: 12px; background: var(--accent); color: #111827;
    display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.3rem;
  }
  .hello h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -.02em; margin: 16px 0 6px; }
  .hello p { color: var(--mut); font-size: .92rem; }
  .chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; padding: 8px 0 16px; }
  .chip {
    font-family: inherit; text-align: left; cursor: pointer; font-size: .85rem; font-weight: 500;
    color: var(--text); background: var(--bg2); border: 1px solid var(--line); border-radius: 10px;
    padding: 12px 14px; transition: border-color .15s, background .15s;
  }
  .chip:hover { border-color: var(--accent); background: var(--panel); }
  .chip span { display: block; color: var(--mut); font-size: .75rem; margin-top: 3px; }

  .composer { border-top: 1px solid var(--line); background: var(--bg2); padding: 14px 20px 18px; }
  .composer .inner { padding: 0; flex-direction: row; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; font-family: inherit; font-weight: 500; font-size: .95rem; color: var(--text);
    background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; padding: 12px 14px;
    resize: none; outline: none; max-height: 160px; transition: border-color .15s;
  }
  textarea:focus { border-color: var(--accent); }
  textarea::placeholder { color: #5a6376; }
  .send {
    font-family: inherit; font-weight: 600; font-size: .88rem; cursor: pointer;
    background: var(--accent); color: #111827; border: none; border-radius: 10px; padding: 12px 20px;
    transition: filter .15s;
  }
  .send:hover { filter: brightness(1.1); }
  .send:disabled { opacity: .45; cursor: default; }
  .err { color: var(--red); }
  .hint { color: var(--mut); font-size: .75rem; text-align: center; padding-top: 10px; }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mark">B</span> BlockBuddy <span class="sub">Scratch AI assistant</span></div>
  <span class="spacer"></span>
  <button class="btn" onclick="resetChat()">New chat</button>
</header>

<div id="chat"><div class="inner" id="feed">
  <div class="hello" id="hello">
    <div class="mark">B</div>
    <h1>What are you building in Scratch?</h1>
    <p>Ask about blocks, bugs, or game mechanics — answers come back as rendered Scratch scripts.</p>
  </div>
  <div class="chips" id="chips"></div>
</div></div>

<div class="composer">
  <div class="inner">
    <textarea id="box" rows="1" placeholder="Ask anything about Scratch…"></textarea>
    <button class="send" id="send" onclick="send()">Send</button>
  </div>
  <div class="hint">Enter to send · Shift+Enter for a new line</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/scratchblocks@3.6.4/build/scratchblocks.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const feed = document.getElementById('feed');
const box = document.getElementById('box');
const sendBtn = document.getElementById('send');
let messages = [];
let busy = false;

const SUGGESTIONS = [
  ['Make my sprite jump', 'with smooth up-and-down motion'],
  ['Rain effect with clones', 'spawn, fall, and delete cleanly'],
  ['Cloud variable high score', 'that saves between plays'],
  ['Debug my forever loop', 'game freezes when it runs'],
  ['Start a platformer', 'gravity, ground, and controls'],
  ['Two-player controls', 'WASD + arrow keys on one keyboard'],
];
document.getElementById('chips').innerHTML = SUGGESTIONS.map(([t, s]) =>
  `<button class="chip" onclick="ask('${t}: ${s}')">${t}<span>${s}</span></button>`).join('');

function ask(q) { box.value = q; send(); }
function resetChat() {
  messages = [];
  [...feed.querySelectorAll('.msg')].forEach(el => el.remove());
  document.getElementById('hello').style.display = '';
  document.getElementById('chips').style.display = '';
}
box.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
box.addEventListener('input', () => { box.style.height = 'auto'; box.style.height = Math.min(box.scrollHeight, 160) + 'px'; });

function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function addMsg(role, html) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<div class="who">${role === 'user' ? 'You' : 'B'}</div><div class="body">${html}</div>`;
  feed.appendChild(div);
  scrollDown();
  return div.querySelector('.body');
}
function scrollDown() { const c = document.getElementById('chat'); c.scrollTop = c.scrollHeight; }

// split text into segments around ```fences``` and render
function renderContent(el, text, final) {
  const parts = text.split(/```/);
  let html = '';
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 0) {
      html += marked.parse(parts[i]);
    } else {
      const nl = parts[i].indexOf('\n');
      const lang = nl >= 0 ? parts[i].slice(0, nl).trim() : '';
      const code = nl >= 0 ? parts[i].slice(nl + 1) : parts[i];
      if (/^scratch/i.test(lang) || lang === '') {
        html += final
          ? `<div class="blockswrap"><pre class="render-blocks">${esc(code.trim())}</pre></div>`
          : `<pre class="blocks-raw">${esc(code)}</pre>`;
      } else {
        html += `<pre class="plain"><code>${esc(code)}</code></pre>`;
      }
    }
  }
  el.innerHTML = html;
  if (final) {
    for (const pre of el.querySelectorAll('pre.render-blocks')) {
      try {
        const doc = scratchblocks.parse(pre.textContent, { style: 'scratch3' });
        const docView = scratchblocks.newView(doc, { style: 'scratch3', scale: 0.72 });
        const svg = docView.render();
        pre.parentNode.replaceChild(svg, pre);
      } catch (e) { /* leave raw text if it doesn't parse */ }
    }
  }
  scrollDown();
}

async function send() {
  const q = box.value.trim();
  if (!q || busy) return;
  busy = true; sendBtn.disabled = true;
  box.value = ''; box.style.height = 'auto';
  document.getElementById('hello').style.display = 'none';
  document.getElementById('chips').style.display = 'none';

  addMsg('user', esc(q));
  messages.push({ role: 'user', content: q });
  const bubble = addMsg('buddy', '<span class="typing"><i></i><i></i><i></i></span>');

  let full = '';
  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages }),
    });
    if (!res.ok || !res.body) throw new Error('Server error ' + res.status);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const events = buf.split('\n\n');
      buf = events.pop();
      for (const ev of events) {
        const line = ev.split('\n').find(l => l.startsWith('data:'));
        if (!line) continue;
        const j = JSON.parse(line.slice(5));
        if (j.text) { full += j.text; renderContent(bubble, full, false); }
        if (j.error) throw new Error(j.error);
      }
    }
    renderContent(bubble, full, true);
    messages.push({ role: 'assistant', content: full });
  } catch (e) {
    bubble.innerHTML = '<span class="err">Something went wrong: ' + esc(e.message) + '</span><br><span style="color:var(--mut)">Try again in a moment.</span>';
  }
  busy = false; sendBtn.disabled = false;
  box.focus();
}
box.focus();
</script>
</body>
</html>
