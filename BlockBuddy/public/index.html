<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧩 BlockBuddy</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧩</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --orange: #ff8c1a; --orange-dark: #e67e17; --blue: #4d97ff; --purple: #9966ff;
    --green: #4cbf56; --paper: #fff8ef; --ink: #34281e; --mut: #94826f; --card: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Nunito', system-ui, sans-serif; background: var(--paper); color: var(--ink);
    display: flex; flex-direction: column;
  }
  header {
    background: var(--orange); color: #fff; padding: 14px 20px;
    display: flex; align-items: center; gap: 12px; box-shadow: 0 3px 0 var(--orange-dark);
    position: sticky; top: 0; z-index: 10;
  }
  header .logo { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 1.5rem; }
  header .tag { font-weight: 800; font-size: .78rem; background: rgba(255,255,255,.22); padding: 4px 12px; border-radius: 999px; }
  header .spacer { flex: 1; }
  header button { background: rgba(255,255,255,.22); color: #fff; }

  #chat { flex: 1; overflow-y: auto; padding: 24px 16px 12px; }
  .inner { max-width: 780px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  .msg { display: flex; gap: 10px; align-items: flex-start; }
  .msg .ava {
    width: 42px; height: 42px; border-radius: 14px; flex: none; display: flex; align-items: center;
    justify-content: center; font-size: 24px; box-shadow: 0 2px 0 rgba(0,0,0,.12);
  }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .ava { background: var(--blue); }
  .msg.buddy .ava { background: var(--orange); }
  .bubble {
    background: var(--card); border: 2px solid #f0e2cf; border-radius: 18px; padding: 14px 18px;
    max-width: 82%; font-size: .98rem; font-weight: 600; line-height: 1.55;
    box-shadow: 0 3px 0 rgba(180, 140, 90, .12);
  }
  .msg.user .bubble { background: var(--blue); border-color: #3a7fe0; color: #fff; box-shadow: 0 3px 0 #2f6cc4; }
  .bubble p { margin: 6px 0; }
  .bubble p:first-child { margin-top: 0; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 6px 0 6px 22px; }
  .bubble li { margin: 3px 0; }
  .bubble h1, .bubble h2, .bubble h3 { font-family: 'Baloo 2', sans-serif; margin: 10px 0 4px; font-size: 1.05rem; }
  .bubble code { background: #fdf0dd; border-radius: 6px; padding: 1px 6px; font-family: ui-monospace, monospace; font-size: .85em; }
  .bubble pre.plain { background: #2d2417; color: #ffe9c9; border-radius: 12px; padding: 12px 14px; overflow-x: auto; margin: 8px 0; }
  .bubble pre.plain code { background: none; color: inherit; padding: 0; }
  .blockswrap { background: #f7f0e5; border: 2px dashed #e5d3b8; border-radius: 12px; padding: 10px 12px; margin: 8px 0; overflow-x: auto; }
  .blockswrap svg { max-width: none; }
  .bubble pre.blocks-raw { font-family: ui-monospace, monospace; font-size: .82rem; color: var(--mut); background: #faf3e8; border-radius: 12px; padding: 10px 12px; overflow-x: auto; margin: 8px 0; }
  .typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
  .typing i { width: 8px; height: 8px; background: var(--orange); border-radius: 50%; animation: hop 1s infinite; }
  .typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes hop { 30% { transform: translateY(-6px); } 60% { transform: none; } }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 4px 0 10px; }
  .chip {
    font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: .85rem; cursor: pointer;
    background: #fff; color: var(--ink); border: 2px solid #eadbc4; border-radius: 999px; padding: 8px 16px;
    box-shadow: 0 2px 0 rgba(180,140,90,.15); transition: transform .1s, border-color .15s;
  }
  .chip:hover { transform: translateY(-2px); border-color: var(--orange); }

  .composer { padding: 10px 16px 18px; background: linear-gradient(transparent, var(--paper) 30%); }
  .composer .inner { flex-direction: row; gap: 10px; align-items: flex-end; }
  textarea {
    flex: 1; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 1rem; color: var(--ink);
    background: #fff; border: 3px solid #eadbc4; border-radius: 16px; padding: 12px 16px;
    resize: none; outline: none; max-height: 140px; transition: border-color .15s;
  }
  textarea:focus { border-color: var(--orange); }
  button {
    font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 1rem; cursor: pointer;
    background: var(--green); color: #fff; border: none; border-radius: 16px; padding: 12px 22px;
    box-shadow: 0 3px 0 #3da046; transition: transform .1s, filter .15s;
  }
  button:hover { filter: brightness(1.06); transform: translateY(-1px); }
  button:disabled { opacity: .5; cursor: default; transform: none; }
  .hello { text-align: center; padding: 30px 10px 8px; }
  .hello .big { font-size: 56px; }
  .hello h1 { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 1.8rem; margin: 6px 0 4px; }
  .hello p { color: var(--mut); font-weight: 700; }
</style>
</head>
<body>
<header>
  <span class="logo">🧩 BlockBuddy</span>
  <span class="tag">Scratch coding coach</span>
  <span class="spacer"></span>
  <button onclick="resetChat()">🧹 New chat</button>
</header>

<div id="chat"><div class="inner" id="feed">
  <div class="hello" id="hello">
    <div class="big">🧩</div>
    <h1>Hey! I'm BlockBuddy.</h1>
    <p>Ask me anything about Scratch — I answer with real blocks you can copy.</p>
  </div>
  <div class="chips" id="chips"></div>
</div></div>

<div class="composer"><div class="inner">
  <textarea id="box" rows="1" placeholder="Ask about Scratch… like: how do I make my sprite jump?"></textarea>
  <button id="send" onclick="send()">Send ➤</button>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/scratchblocks@3.6.4/build/scratchblocks.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const feed = document.getElementById('feed');
const box = document.getElementById('box');
const sendBtn = document.getElementById('send');
let messages = [];
let busy = false;

const SUGGESTIONS = [
  '🕹 How do I make my sprite jump?',
  '🌧 Make it rain with clones',
  '☁ How do cloud variables work?',
  '🏆 Build a high score that saves',
  '🐛 Why does my forever loop freeze everything?',
  '🎮 Start a platformer with me',
];
document.getElementById('chips').innerHTML = SUGGESTIONS.map(s =>
  `<button class="chip" onclick="ask(this.textContent.slice(2).trim())">${s}</button>`).join('');

function ask(q) { box.value = q; send(); }
function resetChat() {
  messages = [];
  [...feed.querySelectorAll('.msg')].forEach(el => el.remove());
  document.getElementById('hello').style.display = '';
  document.getElementById('chips').style.display = '';
}
box.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
box.addEventListener('input', () => { box.style.height = 'auto'; box.style.height = Math.min(box.scrollHeight, 140) + 'px'; });

function esc(s) { return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function addMsg(role, html) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = `<div class="ava">${role === 'user' ? '🧑‍🚀' : '🧩'}</div><div class="bubble">${html}</div>`;
  feed.appendChild(div);
  scrollDown();
  return div.querySelector('.bubble');
}
function scrollDown() { const c = document.getElementById('chat'); c.scrollTop = c.scrollHeight; }

// split text into segments around ```fences``` and render
function renderContent(el, text, final) {
  const parts = text.split(/```/);
  let html = '';
  for (let i = 0; i < parts.length; i++) {
    if (i % 2 === 0) {
      html += marked.parse(parts[i]);
    } else {
      const nl = parts[i].indexOf('\n');
      const lang = nl >= 0 ? parts[i].slice(0, nl).trim() : '';
      const code = nl >= 0 ? parts[i].slice(nl + 1) : parts[i];
      if (/^scratch/i.test(lang) || lang === '') {
        html += final
          ? `<div class="blockswrap"><pre class="render-blocks">${esc(code.trim())}</pre></div>`
          : `<pre class="blocks-raw">${esc(code)}</pre>`;
      } else {
        html += `<pre class="plain"><code>${esc(code)}</code></pre>`;
      }
    }
  }
  el.innerHTML = html;
  if (final) {
    for (const pre of el.querySelectorAll('pre.render-blocks')) {
      try {
        const doc = scratchblocks.parse(pre.textContent, { style: 'scratch3' });
        const docView = scratchblocks.newView(doc, { style: 'scratch3', scale: 0.72 });
        const svg = docView.render();
        pre.parentNode.replaceChild(svg, pre);
      } catch (e) { /* leave raw text if it doesn't parse */ }
    }
  }
  scrollDown();
}

async function send() {
  const q = box.value.trim();
  if (!q || busy) return;
  busy = true; sendBtn.disabled = true;
  box.value = ''; box.style.height = 'auto';
  document.getElementById('hello').style.display = 'none';
  document.getElementById('chips').style.display = 'none';

  addMsg('user', esc(q));
  messages.push({ role: 'user', content: q });
  const bubble = addMsg('buddy', '<span class="typing"><i></i><i></i><i></i></span>');

  let full = '';
  try {
    const res = await fetch('/api/chat', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages }),
    });
    if (!res.ok || !res.body) throw new Error('Server error ' + res.status);
    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      const events = buf.split('\n\n');
      buf = events.pop();
      for (const ev of events) {
        const line = ev.split('\n').find(l => l.startsWith('data:'));
        if (!line) continue;
        const j = JSON.parse(line.slice(5));
        if (j.text) { full += j.text; renderContent(bubble, full, false); }
        if (j.error) throw new Error(j.error);
      }
    }
    renderContent(bubble, full, true);
    messages.push({ role: 'assistant', content: full });
  } catch (e) {
    bubble.innerHTML = '😵 Oops — ' + esc(e.message) + '<br><span style="color:var(--mut)">Try again in a second!</span>';
  }
  busy = false; sendBtn.disabled = false;
  box.focus();
}
box.focus();
</script>
</body>
</html>
