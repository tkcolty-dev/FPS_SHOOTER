# The codes and SESSION_SECRET are set with `cf set-env`, never in this file.
applications:
  - name: christmas-list
    memory: 256M
    disk_quota: 512M
    instances: 1
    buildpacks:
      - nodejs_buildpack
    command: node server.js
    services:
      - christmas-list-db
    env:
      NODE_ENV: production
