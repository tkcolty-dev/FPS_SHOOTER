applications:
  - name: bitewise
    memory: 512M
    disk_quota: 1G
    instances: 2
    buildpacks:
      - nodejs_buildpack
    command: node server.js
    health-check-type: http
    health-check-http-endpoint: /api/status
    health-check-invocation-timeout: 10
    timeout: 120
    services:
      - bitewise-db
      - bitewise-ai
    env:
      NODE_ENV: production
      OPTIMIZE_MEMORY: true
