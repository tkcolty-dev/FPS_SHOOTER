<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💬</text></svg>">
<title>Suggest — comment on Colton's projects</title>
<style>
  :root{
    --bg:#0e1013; --panel:#171a1f; --panel2:#1e232a; --line:#2a303a;
    --text:#e8ecf1; --dim:#98a2b3; --accent:#ffb02e; --accent2:#4c9aff;
    --good:#3ecf8e; --bad:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
       padding-block:0 60px}
  header{border-bottom:1px solid var(--line);background:#12151a;position:sticky;top:0;z-index:5}
  .wrap{max-width:900px;margin:0 auto;padding:0 18px}
  header .wrap{display:flex;align-items:center;gap:12px;height:60px}
  .logo{font-weight:800;font-size:19px;letter-spacing:-.4px}
  .logo span{color:var(--accent)}
  .spacer{flex:1}
  button,.btn{font:inherit;font-weight:600;border-radius:9px;border:1px solid var(--line);
    background:var(--panel2);color:var(--text);padding:9px 14px;cursor:pointer}
  button:hover,.btn:hover{border-color:#3a4351}
  .primary{background:var(--accent);border-color:var(--accent);color:#20160a}
  .primary:hover{background:#ffc257;border-color:#ffc257}
  .ghost{background:transparent}
  h2{font-size:20px;margin:26px 0 14px}
  .grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;
        cursor:pointer;transition:.12s;position:relative}
  .card:hover{border-color:#3d4757;transform:translateY(-2px)}
  .card h3{margin:0 0 6px;font-size:17px}
  .card p{margin:0;color:var(--dim);font-size:13.5px}
  .meta{margin-top:12px;display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--dim)}
  .pill{background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:2px 9px}
  .pill.hot{background:rgba(255,176,46,.15);border-color:rgba(255,176,46,.4);color:var(--accent)}
  .empty{color:var(--dim);border:1px dashed var(--line);border-radius:14px;padding:34px;text-align:center}
  input,textarea,select{font:inherit;width:100%;background:var(--panel2);color:var(--text);
    border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin-top:6px}
  textarea{min-height:96px;resize:vertical}
  label{display:block;margin-top:12px;font-size:13px;color:var(--dim);font-weight:600}
  dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:16px;
         padding:22px;width:min(460px,92vw)}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  .row{display:flex;gap:10px;margin-top:18px}
  .row button{flex:1}
  a{color:var(--accent2)}
  .back{background:none;border:none;color:var(--dim);padding:0;margin:22px 0 6px;font-weight:600}
  .hero{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:10px}
  .hero h1{margin:0 0 6px;font-size:24px}
  .hero p{margin:0;color:var(--dim)}
  .hero .row{margin-top:16px}
  .hero .row .btn{flex:0 0 auto;text-decoration:none;display:inline-block}
  .cmt{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
  .cmt .who{font-weight:700;font-size:14px}
  .cmt .when{color:var(--dim);font-size:12px;font-weight:400;margin-left:8px}
  .cmt .txt{margin-top:7px;white-space:pre-wrap}
  .tag{font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;text-transform:uppercase;letter-spacing:.4px}
  .t-idea{background:rgba(76,154,255,.16);color:#8cc0ff}
  .t-bug{background:rgba(255,107,107,.16);color:#ff9d9d}
  .t-love{background:rgba(62,207,142,.16);color:#7ee5b8}
  .s-accepted{color:var(--good)} .s-rejected{color:var(--bad)} .s-done{color:var(--good)}
  .status{float:right;font-size:12px;font-weight:700}
  .hint{color:var(--dim);font-size:13px;margin-top:6px}
  .kinds{display:flex;gap:8px;margin-top:6px}
  .kinds button{flex:1;font-size:13px;padding:8px}
  .kinds button[aria-pressed=true]{background:var(--accent);color:#20160a;border-color:var(--accent)}
  @media(max-width:520px){ .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<header><div class="wrap">
  <div class="logo">Suggest<span>.</span></div>
  <div class="spacer"></div>
  <button class="ghost" id="addBtn">+ Add project</button>
</div></header>

<main class="wrap" id="app"></main>

<dialog id="addDlg">
  <h2 style="margin:0">Add a project</h2>
  <label>Name<input id="pName" placeholder="BlockWorld 3D Studio"></label>
  <label>Link (optional)<input id="pUrl" placeholder="http://localhost:4770"></label>
  <label>What is it?<textarea id="pDesc" placeholder="Scratch-style block coding for 3D games"></textarea></label>
  <div class="row">
    <button onclick="addDlg.close()">Cancel</button>
    <button class="primary" id="pSave">Add</button>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const app = $('#app');
let projects = [], view = { page:'home', id:null };
const ago = t => { const s=(Date.now()-new Date(t))/1000;
  if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago';
  if(s<86400) return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago'; };
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api = (u,o) => fetch('/api'+u, o && {method:o.m||'POST',headers:{'Content-Type':'application/json'},
                                           body:JSON.stringify(o.b||{})}).then(r=>r.json());

async function home(){
  projects = await api('/projects');
  app.innerHTML = `<h2>Pick a project to comment on</h2>` + (projects.length ? `<div class="grid">` +
    projects.map(p=>`<div class="card" data-id="${p.id}">
        <h3>${esc(p.name)}</h3>
        <p>${esc(p.description||'')}</p>
        <div class="meta">
          <span class="pill${p.newCount?' hot':''}">${p.commentCount} comment${p.commentCount===1?'':'s'}</span>
          ${p.newCount?`<span class="pill hot">${p.newCount} new</span>`:''}
        </div></div>`).join('') + `</div>`
    : `<div class="empty">No projects yet — hit <b>+ Add project</b> to link one.</div>`);
  app.querySelectorAll('.card').forEach(c => c.onclick = () => go('project', c.dataset.id));
}

async function project(pid){
  const p = projects.find(x=>x.id===pid) || (await api('/projects')).find(x=>x.id===pid);
  const comments = await api('/comments?projectId='+pid);
  app.innerHTML = `
    <button class="back" id="back">&larr; all projects</button>
    <div class="hero">
      <h1>${esc(p.name)}</h1>
      <p>${esc(p.description||'')}</p>
      <div class="row">
        ${p.url?`<a class="btn primary" href="${esc(p.url)}" target="_blank" rel="noopener">Open the project &nearr;</a>`:''}
        <button class="ghost" id="del">Delete project</button>
      </div>
    </div>

    <h2>Leave a comment</h2>
    <div class="cmt">
      <div class="kinds" id="kinds">
        <button data-k="idea" aria-pressed="true">Idea</button>
        <button data-k="bug">Bug</button>
        <button data-k="love">Love it</button>
      </div>
      <label>Your name<input id="who" placeholder="who's this?"></label>
      <label>Comment<textarea id="txt" placeholder="What should change, break, or get added?"></textarea></label>
      <div class="row"><button class="primary" id="send">Send comment</button></div>
      <div class="hint">Colton reads these in Claude and decides what gets built.</div>
    </div>

    <h2>${comments.length} comment${comments.length===1?'':'s'}</h2>
    ${comments.length ? comments.map(c=>`<div class="cmt">
        ${c.status!=='new'?`<span class="status s-${c.status}">${c.status==='accepted'?'✓ building this':c.status==='done'?'✓ built':'not this time'}</span>`:''}
        <span class="tag t-${c.kind}">${c.kind}</span>
        <span class="who" style="margin-left:8px">${esc(c.author)}</span>
        <span class="when">${ago(c.createdAt)}</span>
        <div class="txt">${esc(c.text)}</div>
        ${c.note?`<div class="hint">Colton: ${esc(c.note)}</div>`:''}
      </div>`).join('') : `<div class="empty">Nothing yet. Be first.</div>`}`;

  $('#back').onclick = () => go('home');
  $('#del').onclick = async () => { if(confirm('Delete this project and its comments?')){
      await api('/projects/'+pid,{m:'DELETE'}); go('home'); } };
  let kind='idea';
  $('#kinds').onclick = e => { const b=e.target.closest('button'); if(!b)return;
    kind=b.dataset.k; [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed', x===b)); };
  $('#who').value = localStorage.getItem('who')||'';
  $('#send').onclick = async () => {
    const text=$('#txt').value.trim(); if(!text) return $('#txt').focus();
    const author=$('#who').value.trim()||'anonymous'; localStorage.setItem('who',author);
    await api('/comments',{b:{projectId:pid,author,text,kind}});
    project(pid);
  };
}

function go(page,id){ view={page,id};
  location.hash = page==='project' ? '#p/'+id : '';
  page==='home'?home():project(id); window.scrollTo(0,0); }

$('#addBtn').onclick = () => addDlg.showModal();
$('#pSave').onclick = async () => {
  const name=$('#pName').value.trim(); if(!name) return $('#pName').focus();
  await api('/projects',{b:{name,url:$('#pUrl').value.trim(),description:$('#pDesc').value.trim()}});
  $('#pName').value=$('#pUrl').value=$('#pDesc').value=''; addDlg.close(); home();
};

(async()=>{ const m=location.hash.match(/^#p\/(\w+)$/);
  projects = await api('/projects');
  m ? project(m[1]) : home(); })();
</script>
</body>
</html>
