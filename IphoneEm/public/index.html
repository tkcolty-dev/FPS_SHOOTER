<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone 17</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='8' y='1' width='16' height='30' rx='4.5' fill='%23b9a9d6'/%3E%3Crect x='9.5' y='2.5' width='13' height='27' rx='3.2' fill='%23111'/%3E%3Crect x='13' y='4' width='6' height='2' rx='1' fill='%23000'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/css/device.css">
<link rel="stylesheet" href="/css/os.css">
</head>
<body>
<div id="stage">
  <div id="device-wrap">
    <div id="device" data-color="lavender">
      <div class="phone" id="phone">
        <!-- ─────────── FRONT ─────────── -->
        <div class="phone-face phone-front">
          <div class="case-shell"></div>
          <div class="hw-btn hw-action" data-hw="action" title="Action button — silent mode"></div>
          <div class="hw-btn hw-volup" data-hw="volup" title="Volume up"></div>
          <div class="hw-btn hw-voldown" data-hw="voldown" title="Volume down"></div>
          <div class="hw-btn hw-power" data-hw="power" title="Side button — click: sleep/wake · hold: Siri · hold with volume: power off"></div>
          <div class="hw-btn hw-camera" data-hw="camera" title="Camera Control"></div>
          <div class="frame">
            <i class="antenna a1"></i><i class="antenna a2"></i><i class="antenna a3"></i><i class="antenna a4"></i>
            <div class="bezel">
              <div id="screen" data-theme="light">
                <div id="wallpaper"></div>
                <div id="home"></div>
                <div id="apps"></div>
                <div id="switcher"></div>
                <div id="spotlight"></div>
                <div id="lock"></div>
                <div id="nc"></div>
                <div id="cc"></div>
                <div id="banners"></div>
                <div id="keyboard"></div>
                <div id="dialogs"></div>
                <div id="siri"></div>
                <div id="statusbar"></div>
                <div id="island-wrap"><div id="island"></div></div>
                <div id="homebar"><i></i></div>
                <div id="hud"></div>
                <div id="edge-top-left" class="edge-zone"></div>
                <div id="edge-top-right" class="edge-zone"></div>
                <div id="poweroff"></div>
                <div id="dimmer"></div>
                <div id="flash"></div>
                <div id="screen-off"></div>
                <div id="setup"></div>
                <div id="boot"></div>
              </div>
              <div class="glass-glare"></div>
            </div>
          </div>
        </div>
        <!-- ─────────── BACK ─────────── -->
        <div class="phone-face phone-back">
          <div class="case-shell"></div>
          <div class="frame">
            <div class="back-glass">
              <div class="plateau">
                <div class="lens l1"><i></i></div>
                <div class="lens l2"><i></i></div>
                <div class="flashled"></div>
                <div class="backmic"></div>
              </div>
              <div class="back-logo">&#xF8FF;</div>
            </div>
          </div>
        </div>
      </div>
      <div id="cable"><i></i></div>
    </div>
  </div>

  <aside id="panel">
    <h1>iPhone 17</h1>
    <div class="panel-group">
      <label>Finish</label>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="panel-group">
      <label>Case</label>
      <div class="swatches" id="case-swatches"></div>
    </div>
    <div class="panel-group row">
      <button id="btn-flip">Flip</button>
      <button id="btn-charge">Plug in</button>
      <button id="btn-shake">Shake</button>
    </div>
    <div class="panel-group hints">
      <p><b>Swipe up</b> from the bottom bar → Home<br><b>Swipe up &amp; pause</b> → App Switcher<br><b>Top-right corner ↓</b> Control Center<br><b>Top-left ↓</b> Notifications<br><b>Hold an icon</b> → jiggle mode<br><b>Side button</b>: click sleep · hold Siri<br><b>Side + Vol Up</b> → screenshot / power off</p>
      <p class="keys"><kbd>Esc</kbd> Home · <kbd>L</kbd> Lock · <kbd>↑</kbd><kbd>↓</kbd> Volume</p>
    </div>
  </aside>
</div>

<script src="/js/core/util.js"></script>
<script src="/js/core/store.js"></script>
<script src="/js/core/sound.js"></script>
<script src="/js/core/ui.js"></script>
<script src="/js/core/os.js"></script>
<script src="/js/core/keyboard.js"></script>
<script src="/js/core/island.js"></script>
<script src="/js/core/overlays.js"></script>
<script src="/js/core/home.js"></script>
<script src="/js/core/lock.js"></script>
<script src="/js/core/siri.js"></script>
<script src="/js/core/account.js"></script>
<script src="/js/core/webapp.js"></script>
<script src="/js/core/device.js"></script>
<script src="/js/core/boot.js"></script>
</body>
</html>
