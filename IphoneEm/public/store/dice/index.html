<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dice &amp; Coin</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--label:#000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.16);--fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.2);--thumb:#fff;--accent:#5e4be6;--accentSoft:rgba(94,75,230,.12);--red:#ff3b30;--bar:rgba(242,242,247,.86);--shadow:0 1px 2px rgba(0,0,0,.05),0 6px 18px rgba(0,0,0,.04)}
html[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.6);--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.36);--thumb:#636366;--accent:#8f7dff;--accentSoft:rgba(143,125,255,.2);--red:#ff453a;--bar:rgba(0,0,0,.82);--shadow:none}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;background:var(--bg);color:var(--label);user-select:none;-webkit-user-select:none;cursor:default;-webkit-font-smoothing:antialiased;transition:background .3s}
::-webkit-scrollbar{display:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:default}
input{font:inherit;color:inherit;user-select:text;-webkit-user-select:text;border:0;outline:0;background:none;min-width:0}
#app{height:100%;display:flex;flex-direction:column;padding:62px 0 0}
header{display:flex;align-items:center;justify-content:space-between;padding:2px 16px 8px 20px;flex:none}
h1{font-size:32px;font-weight:700;letter-spacing:-.5px}
h1 span{display:inline-block}
h1 span.sw{animation:tin .4s cubic-bezier(.3,1.4,.5,1)}
@keyframes tin{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
.ib{width:38px;height:38px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--accent);transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
.ib:active{transform:scale(.86)}
.ib svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.ib .x{opacity:0;transition:opacity .2s}
.ib.off{color:var(--label2)}
.ib.off .x{opacity:1}
.ib.off .w{opacity:0}
.seg{position:relative;display:flex;flex:none;background:var(--fill);border-radius:10px;padding:2px;height:36px;margin:0 16px}
.seg>i{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/var(--n,4));border-radius:8px;background:var(--thumb);box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.06);transition:transform .4s cubic-bezier(.3,1.35,.5,1)}
.seg button{flex:1;position:relative;font-size:14px;font-weight:500;transition:opacity .2s}
.seg button.on{font-weight:600}
.seg button:active{opacity:.5}
/* stage */
#stage{flex:none;position:relative;height:300px;margin:12px 16px 0;border-radius:26px;overflow:hidden;color:#fff;background:radial-gradient(130% 110% at 50% -10%,#8373ff 0%,#5a46e0 45%,#33249f 100%);box-shadow:0 14px 30px rgba(70,50,200,.28),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .45s cubic-bezier(.3,1.5,.5,1);touch-action:manipulation}
html[data-theme="dark"] #stage{background:radial-gradient(130% 110% at 50% -10%,#6d5df0 0%,#4130b8 45%,#1f1570 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
#stage::before{content:'';position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 62%,rgba(0,0,0,.22),transparent 70%);pointer-events:none}
#stage.press{transform:scale(.98)}
.view{position:absolute;left:0;right:0;top:0;bottom:66px;display:grid;place-items:center;opacity:0;transform:scale(.9);pointer-events:none;transition:opacity .3s,transform .45s cubic-bezier(.3,1.3,.5,1)}
.view.on{opacity:1;transform:none}
#res{position:absolute;left:0;right:0;bottom:0;height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#resT{font-size:26px;font-weight:700;letter-spacing:-.4px;line-height:30px;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#resT.pop{animation:rpop .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes rpop{0%{transform:scale(.5);opacity:0}100%{transform:none;opacity:1}}
#resS{font-size:13.5px;opacity:.72;height:18px;font-variant-numeric:tabular-nums}
/* dice */
#diceWrap{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:26px 34px;padding-top:14px}
.dslot{position:relative;width:var(--s);height:var(--s);perspective:700px;transition:transform .9s cubic-bezier(.2,.8,.3,1);animation:din .5s cubic-bezier(.3,1.6,.5,1) backwards}
@keyframes din{0%{transform:scale(0) rotate(-40deg)}}
.dsh{position:absolute;left:4%;right:4%;bottom:-16%;height:22%;border-radius:50%;background:rgba(10,0,60,.45);filter:blur(7px)}
.hop{position:absolute;inset:0;transform-style:preserve-3d}
.cube{position:absolute;inset:0;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:17%;background:linear-gradient(145deg,#ffffff 0%,#f1f0fa 60%,#dcd9f0 100%);box-shadow:inset 0 0 0 1px rgba(60,40,140,.1),inset 0 0 calc(var(--s)*.12) rgba(60,40,140,.14);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:15%;gap:4%}
.face::after{content:'';position:absolute;inset:0;border-radius:inherit;background:#1b0f66;opacity:.2;transition:opacity .35s}
.face.lit::after{opacity:0}
.face b{border-radius:50%;align-self:center;justify-self:center;width:82%;height:82%;background:radial-gradient(circle at 38% 32%,#55506e,#15122b 70%);box-shadow:inset 0 1px 1.5px rgba(0,0,0,.6),0 .5px 0 rgba(255,255,255,.9)}
.face.one b{width:118%;height:118%;background:radial-gradient(circle at 38% 32%,#ff7b8d,#d9123f 70%)}
.f1{transform:translateZ(calc(var(--s)/2))}
.f6{transform:rotateY(180deg) translateZ(calc(var(--s)/2))}
.f3{transform:rotateY(90deg) translateZ(calc(var(--s)/2))}
.f4{transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}
.f2{transform:rotateX(90deg) translateZ(calc(var(--s)/2))}
.f5{transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
@keyframes hop{0%{transform:translateY(0) scale(1);animation-timing-function:cubic-bezier(.2,.7,.4,1)}32%{transform:translateY(calc(var(--hop,58px)*-1)) scale(1.12);animation-timing-function:cubic-bezier(.6,0,.9,.5)}64%{transform:translateY(0) scale(1);animation-timing-function:cubic-bezier(.2,.7,.4,1)}80%{transform:translateY(-11px) scale(1.02);animation-timing-function:cubic-bezier(.6,0,.9,.5)}100%{transform:translateY(0) scale(1)}}
@keyframes hopsh{0%{transform:scale(1);opacity:1}32%{transform:scale(.62);opacity:.4}64%{transform:scale(1);opacity:1}80%{transform:scale(.9);opacity:.8}100%{transform:scale(1);opacity:1}}
/* coin */
#coinBox{position:relative;width:150px;height:150px;perspective:900px;margin-top:4px}
#coinSh{position:absolute;left:12%;right:12%;bottom:-24px;height:22px;border-radius:50%;background:rgba(10,0,60,.5);filter:blur(8px)}
#coinHop{position:absolute;inset:0;transform-style:preserve-3d}
#coin{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(0deg)}
#coin div{position:absolute;inset:0;border-radius:50%}
#coin .edge{background:#b47a08}
#coin .side{background:radial-gradient(circle at 34% 28%,#fff3b8 0%,#ffd451 30%,#f0ad14 68%,#c98a06 100%);box-shadow:inset 0 0 0 5px rgba(160,100,0,.35),inset 0 0 0 7px rgba(255,240,170,.55);display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
#coin .side svg{width:100%;height:100%}
#coin .hd{transform:translateZ(6px)}
#coin .tl{transform:rotateX(180deg) translateZ(6px)}
@keyframes chop{0%{transform:translateY(0) scale(1);animation-timing-function:cubic-bezier(.15,.7,.4,1)}45%{transform:translateY(-32px) scale(1.24);animation-timing-function:cubic-bezier(.6,0,.85,.4)}84%{transform:translateY(0) scale(1);animation-timing-function:cubic-bezier(.2,.7,.4,1)}92%{transform:translateY(-7px) scale(1.01)}100%{transform:translateY(0) scale(1)}}
@keyframes chopsh{0%{transform:scale(1);opacity:1}45%{transform:scale(.5);opacity:.3}84%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:1}}
/* number */
#numBox{display:flex;align-items:center;justify-content:center;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-2px;font-family:system-ui,-apple-system,'SF Pro Display','Helvetica Neue',sans-serif;padding-top:16px;text-shadow:0 6px 18px rgba(10,0,80,.35)}
#numBox.pop{animation:npop .5s cubic-bezier(.3,1.9,.5,1)}
@keyframes npop{0%{transform:scale(1)}35%{transform:scale(1.14)}100%{transform:none}}
.reel{overflow:hidden;height:var(--h);-webkit-mask-image:linear-gradient(transparent,#000 13%,#000 87%,transparent);mask-image:linear-gradient(transparent,#000 13%,#000 87%,transparent)}
.reel div{display:flex;flex-direction:column;will-change:transform}
.reel span,.minus{display:block;height:var(--h);line-height:var(--h);text-align:center}
/* list */
#slot{position:relative;width:322px;height:192px;margin-top:16px;overflow:hidden;border-radius:20px;background:rgba(16,6,90,.35);box-shadow:inset 0 2px 10px rgba(0,0,40,.4),0 1px 0 rgba(255,255,255,.16)}
#slot::before{content:'';position:absolute;left:8px;right:8px;top:64px;height:64px;border-radius:14px;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35);transition:background .3s}
#slot.win::before{background:rgba(255,255,255,.3);animation:winb .7s ease-out}
@keyframes winb{0%{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35),0 0 0 0 rgba(255,255,255,.6)}100%{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35),0 0 0 22px rgba(255,255,255,0)}}
#slot::after{content:'';position:absolute;inset:0;background:linear-gradient(rgba(40,26,150,.92),rgba(40,26,150,0) 34%,rgba(40,26,150,0) 66%,rgba(40,26,150,.92));pointer-events:none}
#strip{position:relative;will-change:transform}
#strip div{height:64px;line-height:64px;text-align:center;font-size:25px;font-weight:600;letter-spacing:-.3px;padding:0 24px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#strip div.w{animation:npop .55s cubic-bezier(.3,1.9,.5,1)}
/* panel */
#panel{flex:1;min-height:0;overflow-y:auto;padding:14px 16px 16px;overscroll-behavior:contain}
.pane{display:none}
.pane.on{display:block;animation:tin .35s cubic-bezier(.3,1.3,.5,1)}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);transition:background .3s}
.cap{font-size:13px;color:var(--label2);text-transform:uppercase;padding:16px 16px 7px;letter-spacing:.2px;display:flex;justify-content:space-between;align-items:center}
.cap:first-child{padding-top:0}
.cap button{color:var(--accent);text-transform:none;font-size:14px;padding:2px 0}
.cap button:active{opacity:.4}
.crow{display:flex;align-items:center;padding:10px 12px 10px 16px;gap:12px;font-size:17px}
.crow .t{flex:1}
#cnt{display:flex;gap:6px}
#cnt button{width:36px;height:36px;border-radius:11px;background:var(--fill);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;transition:transform .3s cubic-bezier(.3,1.8,.5,1),background .2s,color .2s}
#cnt button:active{transform:scale(.85)}
#cnt button.on{background:var(--accent);color:#fff;transform:scale(1.06)}
html[data-theme="dark"] #cnt button.on{color:#0d0640}
/* tally */
#tally{padding:14px 16px 14px}
#tally .nums{display:flex;justify-content:space-between;align-items:flex-end}
#tally .nums div{font-size:13px;color:var(--label2);font-weight:500}
#tally .nums div:last-child{text-align:right}
#tally .nums strong{display:block;font-size:30px;font-weight:700;color:var(--label);letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:32px}
#tbar{height:10px;border-radius:5px;background:var(--fill2);margin-top:10px;overflow:hidden;display:flex}
#tbar i{display:block;height:100%;background:linear-gradient(90deg,#ffc93c,#f0a500);width:50%;transition:width .6s cubic-bezier(.3,1.2,.4,1);border-radius:5px 0 0 5px}
#tbar u{display:block;flex:1;background:var(--accent);opacity:.85}
#tbar.zero i{width:0!important}
#tbar.zero u{opacity:0}
/* number inputs */
#range{display:flex;align-items:stretch}
#range label{flex:1;padding:10px 16px 10px;display:block;position:relative}
#range label+label::before{content:'';position:absolute;left:0;top:12px;bottom:12px;width:.5px;background:var(--sep)}
#range small{display:block;font-size:12px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.3px}
#range input{width:100%;font-size:28px;font-weight:600;letter-spacing:-.4px;height:36px;caret-color:var(--accent);cursor:text;font-variant-numeric:tabular-nums}
#presets{display:flex;gap:6px;margin-top:10px}
#presets button{flex:1;height:36px;border-radius:11px;background:var(--card);box-shadow:var(--shadow);font-size:14px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums;transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
#presets button:active{transform:scale(.9)}
/* options */
.orow{display:flex;align-items:center;min-height:46px;padding:0 6px 0 16px;position:relative;font-size:17px;animation:tin .3s cubic-bezier(.3,1.3,.5,1)}
.orow+.orow::before,#addRow::before{content:'';position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.orow span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow button{width:36px;height:40px;display:grid;place-items:center}
.orow button i{width:20px;height:20px;border-radius:50%;background:var(--fill2);display:grid;place-items:center;font-style:normal;font-size:14px;font-weight:700;color:var(--label2);line-height:1;transition:transform .25s cubic-bezier(.3,1.8,.5,1)}
.orow button:active i{transform:scale(.75)}
#addRow{display:flex;align-items:center;height:48px;padding:0 8px 0 16px;position:relative}
#addRow:first-child::before{display:none}
#addRow input{flex:1;font-size:17px;height:48px;caret-color:var(--accent);cursor:text}
#addRow input::placeholder{color:var(--label3)}
#addRow.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
#addBtn{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:21px;font-weight:500;line-height:1;transition:transform .3s cubic-bezier(.3,1.8,.5,1),opacity .2s}
#addBtn:active{transform:scale(.8)}
#addBtn[disabled]{opacity:.3}
/* history */
.hrow{display:flex;align-items:center;min-height:46px;padding:0 16px;position:relative;gap:10px}
.hrow+.hrow::before{content:'';position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.hrow.new{animation:hin .45s cubic-bezier(.3,1.3,.5,1)}
@keyframes hin{0%{opacity:0;transform:translateY(-12px)}100%{opacity:1;transform:none}}
.hrow .m{flex:1;min-width:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hrow .m.die{font-size:25px;letter-spacing:2px;line-height:30px;color:var(--label2)}
.hrow .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.hrow .tm{font-size:13px;color:var(--label3);min-width:30px;text-align:right;font-variant-numeric:tabular-nums}
.hrow .dot{width:12px;height:12px;border-radius:50%;flex:none}
.hrow .dot.h{background:linear-gradient(135deg,#ffd451,#f0a500)}
.hrow .dot.t{background:var(--accent)}
.hempty{padding:18px 16px;text-align:center;font-size:15px;color:var(--label2)}
/* bottom bar */
#bar{flex:none;padding:10px 16px 42px;background:var(--bar);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border-top:.5px solid var(--sep)}
#go{width:100%;height:54px;border-radius:16px;background:var(--accent);color:#fff;font-size:18px;font-weight:600;letter-spacing:-.2px;box-shadow:0 8px 20px rgba(94,75,230,.35);transition:transform .3s cubic-bezier(.3,1.7,.5,1),opacity .2s}
html[data-theme="dark"] #go{color:#0d0640;box-shadow:none}
#go:active{transform:scale(.96)}
#go.busy{opacity:.55}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><span id="title">Dice</span></h1>
    <button class="ib" id="snd" aria-label="Sound"><svg viewBox="0 0 24 24"><path d="M4 9.500v5h3.500L12 18.500v-13L7.500 9.500z" fill="currentColor" stroke-width="1.6"/><path class="w" d="M15.500 9a4.200 4.200 0 0 1 0 6M18 6.500a7.800 7.800 0 0 1 0 11"/><path class="x" d="M16 9.500l5 5M21 9.500l-5 5"/></svg></button>
  </header>
  <div class="seg" id="seg" style="--n:4"><i></i><button data-m="dice">Dice</button><button data-m="coin">Coin</button><button data-m="num">Number</button><button data-m="list">List</button></div>

  <div id="stage">
    <div class="view" id="vDice"><div id="diceWrap"></div></div>
    <div class="view" id="vCoin">
      <div id="coinBox"><div id="coinSh"></div><div id="coinHop"><div id="coin"></div></div></div>
    </div>
    <div class="view" id="vNum"><div id="numBox"></div></div>
    <div class="view" id="vList"><div id="slot"><div id="strip"></div></div></div>
    <div id="res"><div id="resT"></div><div id="resS"></div></div>
  </div>

  <div id="panel">
    <div class="pane" id="pDice">
      <div class="card crow"><div class="t">Number of dice</div><div id="cnt"></div></div>
    </div>
    <div class="pane" id="pCoin">
      <div class="card" id="tally">
        <div class="nums"><div><strong id="tH">0</strong>Heads</div><div><strong id="tT">0</strong>Tails</div></div>
        <div id="tbar" class="zero"><i></i><u></u></div>
      </div>
    </div>
    <div class="pane" id="pNum">
      <div class="card" id="range">
        <label><small>Minimum</small><input id="minI" type="text" inputmode="numeric" maxlength="7" autocomplete="off"></label>
        <label><small>Maximum</small><input id="maxI" type="text" inputmode="numeric" maxlength="7" autocomplete="off"></label>
      </div>
      <div id="presets"><button data-a="1" data-b="6">1–6</button><button data-a="1" data-b="10">1–10</button><button data-a="1" data-b="100">1–100</button><button data-a="0" data-b="999">0–999</button></div>
    </div>
    <div class="pane" id="pList">
      <div class="cap"><span>Options</span><span id="optN"></span></div>
      <div class="card"><div id="opts"></div><div id="addRow"><input id="optI" type="text" maxlength="24" placeholder="Add an option" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done"><button id="addBtn" aria-label="Add" disabled>+</button></div></div>
    </div>
    <div class="cap"><span>Recent</span><button id="clr">Clear</button></div>
    <div class="card" id="hist"></div>
  </div>

  <div id="bar"><button id="go">Roll</button></div>
</div>

<script src="/sdk.js"></script>
<script>
(function(){
'use strict';
var iPhone = window.iPhone || {theme:'light',haptic:function(){},sound:function(){},notify:function(){},setStatusBar:function(){},onPause:function(){},onResume:function(){},onTheme:function(){},
  storage:{get:function(k,f){return Promise.resolve(f);},set:function(){return Promise.resolve();},remove:function(){return Promise.resolve();}}};
function $(id){return document.getElementById(id);}
function applyTheme(t){ document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light'); iPhone.setStatusBar(t==='dark'?'light':'dark'); }
var startTheme=iPhone.theme||'light';
if(window.parent===window && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) startTheme='dark';
applyTheme(startTheme); iPhone.onTheme(applyTheme);

var MODES=['dice','coin','num','list'];
var META={dice:{t:'Dice',go:'Roll',v:'vDice',p:'pDice'},coin:{t:'Coin',go:'Flip',v:'vCoin',p:'pCoin'},num:{t:'Number',go:'Generate',v:'vNum',p:'pNum'},list:{t:'List',go:'Spin',v:'vList',p:'pList'}};
var S={mode:'dice',count:2,min:1,max:100,opts:['Pizza','Tacos','Sushi','Burgers'],tally:{h:0,t:0},hist:{dice:[],coin:[],num:[],list:[]},sound:true};
var busy=false, paused=false;
function rnd(n){
  if(window.crypto&&crypto.getRandomValues){ var a=new Uint32Array(1), lim=Math.floor(4294967296/n)*n; do{ crypto.getRandomValues(a); }while(a[0]>=lim); return a[0]%n; }
  return Math.floor(Math.random()*n);
}
var saveT=0;
function save(){ clearTimeout(saveT); saveT=setTimeout(function(){ iPhone.storage.set('state',S); },150); }

/* ---------- audio (subtle) ---------- */
var ctx=null;
function ac(){
  if(!S.sound||paused) return null;
  if(!ctx){ var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return null; try{ ctx=new AC(); }catch(e){ return null; } }
  if(ctx.state==='suspended') ctx.resume().catch(function(){});
  return ctx;

})($('panel'));

/* lifecycle */
iPhone.onPause(function(){ paused=true; clearTimeout(saveT); iPhone.storage.set('state',S); if(ctx&&ctx.state==='running') ctx.suspend().catch(function(){}); });
iPhone.onResume(function(){ paused=false; renderHist(false); });
setInterval(function(){ if(!busy&&!paused) renderHist(false); },30000);

function boot(){
  $('minI').value=S.min; $('maxI').value=S.max;
  renderSnd(); renderCount(); buildDice(); renderTally(); renderOpts(); staticStrip(); showNumber(S.min===1&&S.max===100?7:S.min,false); numShown=null;
  setMode(S.mode,true);
}
boot();
iPhone.storage.get('state',null).then(function(v){
  if(!v||typeof v!=='object'||busy) return;
  if(MODES.indexOf(v.mode)>=0) S.mode=v.mode;
  if(v.count>=1&&v.count<=6) S.count=Math.round(v.count);
  if(isFinite(v.min)&&isFinite(v.max)){ S.min=Math.round(v.min); S.max=Math.round(v.max); }
  if(Array.isArray(v.opts)) S.opts=v.opts.filter(function(x){return typeof x==='string'&&x.trim();}).slice(0,20).map(function(x){return x.slice(0,24);});
  if(v.tally&&v.tally.h>=0&&v.tally.t>=0) S.tally={h:Math.round(v.tally.h),t:Math.round(v.tally.t)};
  if(v.hist&&typeof v.hist==='object') MODES.forEach(function(m){ if(Array.isArray(v.hist[m])) S.hist[m]=v.hist[m].filter(function(e){
    if(!e||!isFinite(e.ts)) return false;
    if(m==='dice') return Array.isArray(e.v)&&e.v.length>0&&e.v.every(function(x){return x>=1&&x<=6;});
    if(m==='coin') return e.v==='h'||e.v==='t';
    if(m==='num') return isFinite(e.v)&&isFinite(e.a)&&isFinite(e.b);
    return typeof e.v==='string';
  }).slice(0,30); });
  if(typeof v.sound==='boolean') S.sound=v.sound;
  boot();
}).catch(function(){});
})();
</script>
