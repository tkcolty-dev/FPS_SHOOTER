<!DOCTYPE html>
<html lang="en" data-phase="focus">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Focus Timer</title>
<style>
@property --accent{syntax:'<color>';inherits:true;initial-value:#ff5a4e}
:root{--bg:#f2f2f7;--card:#fff;--sheet:#f2f2f7;--label:#000;--label2:rgba(60,60,67,.6);--label3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.16);--fill:rgba(120,120,128,.12);--fill2:rgba(120,120,128,.2);--thumb:#fff;--accent:#ff5a4e;--onAccent:#fff;--track:rgba(120,120,128,.14);--shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.05)}
html[data-phase="short"]{--accent:#1aae83}
html[data-phase="long"]{--accent:#3d7bfa}
html[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--sheet:#1c1c1e;--label:#fff;--label2:rgba(235,235,245,.6);--label3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.6);--fill:rgba(120,120,128,.24);--fill2:rgba(120,120,128,.36);--thumb:#636366;--accent:#ff6b5e;--track:rgba(120,120,128,.22);--shadow:none}
html[data-theme="dark"][data-phase="short"]{--accent:#34d3a0}
html[data-theme="dark"][data-phase="long"]{--accent:#5b95ff}
html{transition:--accent .7s ease}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:system-ui,-apple-system,'SF Pro Text','Helvetica Neue',sans-serif;background:var(--bg);color:var(--label);user-select:none;-webkit-user-select:none;cursor:default;-webkit-font-smoothing:antialiased;transition:background .3s}
::-webkit-scrollbar{display:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:default}
#tint{position:fixed;inset:0;pointer-events:none;background:radial-gradient(130% 62% at 50% 0%,var(--accent),transparent 72%);opacity:.17}
html[data-theme="dark"] #tint{opacity:.24}
#app{position:relative;height:100%;display:flex;flex-direction:column;padding:62px 0 34px}
header{display:flex;align-items:center;justify-content:space-between;padding:2px 16px 8px 20px;flex:none}
h1{font-size:32px;font-weight:700;letter-spacing:-.5px}
.hb{display:flex;gap:8px}
.ib{width:38px;height:38px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--accent);transition:transform .3s cubic-bezier(.3,1.7,.5,1)}
.ib:active{transform:scale(.86)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
.seg{position:relative;display:flex;flex:none;background:var(--fill);border-radius:10px;padding:2px;height:36px;margin:0 16px}
.seg i{position:absolute;top:2px;bottom:2px;left:2px;width:calc((100% - 4px)/3);border-radius:8px;background:var(--thumb);box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.06);transition:transform .4s cubic-bezier(.3,1.35,.5,1)}
.seg button{flex:1;position:relative;font-size:13.5px;font-weight:500;transition:opacity .2s}
.seg button.on{font-weight:600}
.seg button:active{opacity:.5}
#stage{position:relative;flex:1;min-height:0;display:grid;place-items:center}
#ringBox{position:relative;width:308px;height:308px;transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
#stage.press #ringBox{transform:scale(.975)}
#ring{width:100%;height:100%;overflow:visible;display:block}
.trk{fill:none;stroke:var(--track);stroke-width:14}
#prg{fill:none;stroke:var(--accent);stroke-width:14;stroke-linecap:round;filter:drop-shadow(0 0 7px color-mix(in srgb,var(--accent) 50%,transparent))}
#knob{fill:#fff;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}
#burst{fill:none;stroke:var(--accent);stroke-width:3;opacity:0;transform-origin:150px 150px}
#stage.done #burst{animation:burst .9s ease-out}
#stage.done #ringBox{animation:pulse .9s cubic-bezier(.3,1.5,.5,1)}
@keyframes burst{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.32)}}
@keyframes pulse{0%{transform:scale(1)}30%{transform:scale(1.06)}100%{transform:scale(1)}}
#center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
#pl{font-size:12.5px;font-weight:700;letter-spacing:1.4px;color:var(--accent);text-transform:uppercase}
#time{font-size:78px;font-weight:200;letter-spacing:-2px;line-height:92px;font-variant-numeric:tabular-nums;font-family:system-ui,-apple-system,'SF Pro Display','Helvetica Neue',sans-serif}
#sub{font-size:15px;color:var(--label2);height:20px}
#stage.paused #time{animation:breathe 2s ease-in-out infinite}
@keyframes breathe{50%{opacity:.45}}
#dots{flex:none;display:flex;justify-content:center;gap:10px;height:14px;margin-bottom:22px}
#dots b{width:12px;height:12px;border-radius:50%;border:2px solid var(--label3);transition:background .4s,border-color .4s,transform .45s cubic-bezier(.3,1.9,.5,1)}
#dots b.on{background:var(--accent);border-color:var(--accent);transform:scale(1.12)}
#dots b.cur{border-color:var(--accent)}
#dots.run b.cur{animation:dotp 1.6s ease-in-out infinite}
@keyframes dotp{50%{transform:scale(1.35);opacity:.55}}
#ctrl{flex:none;display:flex;align-items:center;justify-content:center;gap:30px;margin-bottom:22px}
.cb{width:58px;height:58px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--label);transition:transform .3s cubic-bezier(.3,1.7,.5,1),opacity .25s}
html[data-theme="dark"] .cb{background:var(--fill)}
.cb:active{transform:scale(.86)}
.cb[disabled]{opacity:.35;pointer-events:none}
.cb svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.cb svg.f{fill:currentColor;stroke-width:1.6}
#play{width:88px;height:88px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;position:relative;box-shadow:0 10px 26px color-mix(in srgb,var(--accent) 45%,transparent);transition:transform .35s cubic-bezier(.3,1.7,.5,1)}
#play:active{transform:scale(.9)}
#play svg{position:absolute;width:36px;height:36px;fill:currentColor;transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .2s}
#play .ipa{opacity:0;transform:scale(.4) rotate(-90deg)}
#play.on .ipa{opacity:1;transform:none}
#play.on .ipl{opacity:0;transform:scale(.4) rotate(90deg)}
#today{flex:none;margin:0 16px 10px;background:var(--card);border-radius:18px;box-shadow:var(--shadow);display:flex;padding:13px 0;transition:background .3s}
#today div{flex:1;text-align:center;position:relative}
#today div+div::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:.5px;background:var(--sep)}
#today strong{display:block;font-size:24px;font-weight:700;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
#today strong.pop{animation:pop .5s cubic-bezier(.3,1.9,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:none}}
#today span{font-size:11.5px;color:var(--label2);font-weight:500;text-transform:uppercase;letter-spacing:.3px}
/* sheets */
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.38);opacity:0;pointer-events:none;transition:opacity .35s;z-index:10}
#backdrop.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;background:var(--sheet);border-radius:22px 22px 0 0;transform:translateY(110%);transition:transform .5s cubic-bezier(.25,1.1,.35,1);padding:0 16px 48px;max-height:calc(100% - 76px);display:flex;flex-direction:column}
.sheet::after{content:'';position:absolute;left:0;right:0;top:100%;height:80px;background:var(--sheet)}
.sheet.on{transform:none;box-shadow:0 -10px 40px rgba(0,0,0,.18)}
.sh-head{flex:none;display:flex;align-items:center;justify-content:space-between;padding:22px 4px 12px;position:relative;touch-action:none}
.sh-head::before{content:'';position:absolute;left:50%;top:7px;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:var(--label3)}
.sh-head h2{font-size:22px;font-weight:700;letter-spacing:-.3px}
.sh-head button{color:var(--accent);font-size:17px;font-weight:600;padding:4px 2px}
.sh-head button:active{opacity:.4}
.sh-body{flex:1;min-height:0;overflow-y:auto}
html[data-theme="dark"] .sheet .group,html[data-theme="dark"] .sheet .tile,html[data-theme="dark"] .sheet .chart{background:#2c2c2e}
.cap{font-size:13px;color:var(--label2);text-transform:uppercase;padding:14px 16px 6px;letter-spacing:.2px}
.group{background:var(--card);border-radius:14px}
.rowi{display:flex;align-items:center;min-height:52px;padding:0 12px 0 16px;position:relative;font-size:17px}
.rowi+.rowi::before{content:'';position:absolute;left:16px;right:0;top:0;height:.5px;background:var(--sep)}
.rowi .t{flex:1}
.rowi .v{font-size:17px;color:var(--label2);margin-right:12px;font-variant-numeric:tabular-nums;min-width:62px;text-align:right}
.rowi .v.bump{animation:pop .3s cubic-bezier(.3,1.8,.5,1)}
.stepper{display:flex;align-items:center;background:var(--fill);border-radius:9px;height:34px}
.stepper button{width:44px;height:34px;font-size:24px;font-weight:300;display:grid;place-items:center;transition:transform .2s cubic-bezier(.3,1.7,.5,1)}
.stepper button:active{transform:scale(.75)}
.stepper button[disabled]{opacity:.3}
.stepper span{width:1px;height:18px;background:var(--label3)}
.switch{width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;transition:background .25s;flex:none}
.switch::after{content:'';position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .3s cubic-bezier(.3,1.4,.5,1)}
.switch.on{background:#34c759}
.switch.on::after{transform:translateX(20px)}
.plain{width:100%;height:50px;border-radius:14px;background:var(--card);color:var(--accent);font-size:17px;margin-top:16px;transition:opacity .2s}
html[data-theme="dark"] .sheet .plain{background:#2c2c2e}
.plain:active{opacity:.5}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:16px;padding:12px 14px}
.tile small{font-size:12px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.3px;display:flex;align-items:center;gap:5px}
.tile small u{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block}
.tile strong{display:block;font-size:30px;font-weight:700;letter-spacing:-.6px;margin-top:2px;font-variant-numeric:tabular-nums}
.tile strong em{font-style:normal;font-size:16px;font-weight:600;color:var(--label2);margin:0 5px 0 1px;letter-spacing:0}
.chart{background:var(--card);border-radius:16px;padding:14px 14px 10px;margin-top:10px}
.chart .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.chart .hd b{font-size:16px}
.chart .hd span{font-size:13px;color:var(--label2)}
#bars{display:flex;align-items:flex-end;gap:9px;height:150px}
#bars .c{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
#bars .n{font-size:11px;color:var(--label2);font-weight:600;margin-bottom:4px;font-variant-numeric:tabular-nums;height:13px}
#bars .b{width:100%;border-radius:7px;background:var(--accent);opacity:.38;height:4px;min-height:4px;transition:height .7s cubic-bezier(.25,1.2,.4,1)}
#bars .c.z .b{background:var(--fill2);opacity:1}
#bars .c.t .b{opacity:1}
#bars .d{font-size:12px;color:var(--label2);margin-top:7px;font-weight:500}
#bars .c.t .d{color:var(--accent);font-weight:700}
/* alert */
#alert{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .22s}
#alert.on{opacity:1;pointer-events:auto}
.abox{width:272px;border-radius:15px;background:rgba(245,245,247,.94);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);text-align:center;transform:scale(1.15);transition:transform .35s cubic-bezier(.3,1.4,.5,1);overflow:hidden}
html[data-theme="dark"] .abox{background:rgba(44,44,46,.94)}
#alert.on .abox{transform:none}
.abox b{display:block;font-size:17px;padding:19px 16px 3px}
.abox p{font-size:13px;line-height:17px;padding:0 16px 17px}
.abox div{display:flex;border-top:.5px solid var(--sep)}
.abox button{flex:1;height:44px;font-size:17px;color:#007aff}
html[data-theme="dark"] .abox button{color:#0a84ff}
.abox button+button{border-left:.5px solid var(--sep);font-weight:600;color:#ff3b30}
html[data-theme="dark"] .abox button+button{color:#ff453a}
.abox button:active{background:var(--fill)}
</style>
</head>
<body>
<div id="tint"></div>
<div id="app">
  <header>
    <h1>Focus Timer</h1>
    <div class="hb">
      <button class="ib" id="bStats" aria-label="Statistics"><svg viewBox="0 0 24 24"><path d="M5 20v-8M12 20V4M19 20v-5"/></svg></button>
      <button class="ib" id="bSet" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.6"/><circle cx="8" cy="17" r="2.6"/></svg></button>
    </div>
  </header>
  <div class="seg" id="seg"><i></i><button data-p="focus">Focus</button><button data-p="short">Short Break</button><button data-p="long">Long Break</button></div>
  <div id="stage">
    <div id="ringBox">
      <svg id="ring" viewBox="0 0 300 300">
        <circle class="trk" cx="150" cy="150" r="132"/>
        <circle id="burst" cx="150" cy="150" r="140"/>
        <circle id="prg" cx="150" cy="150" r="132" transform="rotate(-90 150 150) translate(0 300) scale(1 -1)"/>
        <circle id="knob" cx="150" cy="18" r="8.5"/>
      </svg>
      <div id="center"><div id="pl">Focus</div><div id="time">25:00</div><div id="sub"></div></div>
    </div>
  </div>
  <div id="dots"></div>
  <div id="ctrl">
    <button class="cb" id="reset" aria-label="Reset"><svg viewBox="0 0 24 24"><path d="M1.5 4.5v6h6"/><path d="M4 15a9 9 0 1 0 2.1-9.4L1.5 10.5"/></svg></button>
    <button id="play" aria-label="Start or pause">
      <svg class="ipl" viewBox="0 0 24 24"><path d="M8 5.6v12.8a1 1 0 0 0 1.53.85l10.2-6.4a1 1 0 0 0 0-1.7L9.53 4.75A1 1 0 0 0 8 5.6z"/></svg>
      <svg class="ipa" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4.4" height="15" rx="1.4"/><rect x="13.6" y="4.5" width="4.4" height="15" rx="1.4"/></svg>
    </button>
    <button class="cb" id="skip" aria-label="Skip"><svg class="f" viewBox="0 0 24 24"><path d="M5 5.2v13.6a.8.8 0 0 0 1.25.66L16 12.66a.8.8 0 0 0 0-1.32L6.25 4.54A.8.8 0 0 0 5 5.2z"/><rect x="17.6" y="4.5" width="2.2" height="15" rx="1.1"/></svg></button>
  </div>
  <div id="today">
    <div><strong id="tN">0</strong><span>Sessions</span></div>
    <div><strong id="tM">0</strong><span>Focus min</span></div>
    <div><strong id="tS">0</strong><span>Day streak</span></div>
  </div>
</div>

<div id="backdrop"></div>

<div class="sheet" id="shSet">
  <div class="sh-head"><h2>Settings</h2><button data-close>Done</button></div>
  <div class="sh-body">
    <div class="cap" style="padding-top:2px">Lengths</div>
    <div class="group" id="gLen"></div>
    <div class="cap">Behaviour</div>
    <div class="group">
      <div class="rowi" data-sw="auto"><div class="t">Auto-start next phase</div><div class="switch"></div></div>
      <div class="rowi" data-sw="sound"><div class="t">Chime when a phase ends</div><div class="switch"></div></div>
    </div>
    <button class="plain" id="defaults">Restore Defaults</button>
  </div>
</div>

<div class="sheet" id="shStats">
  <div class="sh-head"><h2>Your Focus</h2><button data-close>Done</button></div>
  <div class="sh-body">
    <div class="tiles">
      <div class="tile"><small><u></u>Today</small><strong id="sToday">0</strong></div>
      <div class="tile"><small><u></u>Focus time</small><strong id="sTime">0</strong></div>
      <div class="tile"><small><u></u>Day streak</small><strong id="sStreak">0</strong></div>
      <div class="tile"><small><u></u>All time</small><strong id="sAll">0</strong></div>
    </div>
    <div class="chart">
      <div class="hd"><b>Last 7 days</b><span id="wk"></span></div>
      <div id="bars"></div>
    </div>
  </div>
</div>

<div id="alert"><div class="abox"><b id="aT"></b><p id="aM"></p><div><button id="aNo">Keep Going</button><button id="aYes">End</button></div></div></div>

<script src="/sdk.js"></script>
<script>
(function(){
'use strict';
var iPhone = window.iPhone || {theme:'light',haptic:function(){},sound:function(){},notify:function(){},setStatusBar:function(){},onPause:function(){},onResume:function(){},onTheme:function(){},
  storage:{get:function(k,f){return Promise.resolve(f);},set:function(){return Promise.resolve();},remove:function(){return Promise.resolve();}}};
function $(id){return document.getElementById(id);}
function applyTheme(t){ document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light'); iPhone.setStatusBar(t==='dark'?'light':'dark'); }
var startTheme=iPhone.theme||'light';
if(window.parent===window && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) startTheme='dark';
applyTheme(startTheme); iPhone.onTheme(applyTheme);

/* ---------- state ---------- */
var DEF={focus:25,short:5,long:15,every:4,auto:false,sound:true};
var LIM={focus:[1,90],short:[1,30],long:[1,60],every:[2,8]};
var NAMES={focus:'Focus',short:'Short Break',long:'Long Break'};
var ORDER=['focus','short','long'];
var cfg={}; for(var k0 in DEF) cfg[k0]=DEF[k0];
var st={phase:'focus',running:false,endAt:0,remain:DEF.focus*60000,total:DEF.focus*60000,done:0};
var log={}, all={n:0,m:0};
var bg=false, raf=0, endT=0;
var C=2*Math.PI*132;

function pad(n){return (n<10?'0':'')+n;}
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function dayBack(i){var d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()-i); return d;}
function dur(p){return cfg[p]*60000;}
function remaining(){return st.running?Math.max(0,st.endAt-Date.now()):st.remain;}
function untouched(){return !st.running&&st.remain>=st.total;}

function saveSt(){iPhone.storage.set('st',st);}
function saveCfg(){iPhone.storage.set('cfg',cfg);}
function saveLog(){iPhone.storage.set('log',log); iPhone.storage.set('all',all);}

/* ---------- rendering ---------- */
var lastTxt='';
function renderTime(){
  var rem=remaining(), s=Math.ceil(rem/1000-0.001); if(s<0)s=0;
  var txt=pad(Math.floor(s/60))+':'+pad(s%60);
  if(txt!==lastTxt){ $('time').textContent=txt; lastTxt=txt; }
  var f=st.total>0?Math.max(0,Math.min(1,rem/st.total)):0;
  var p=$('prg');
  p.setAttribute('stroke-dasharray',(C*f).toFixed(2)+' '+(C+10).toFixed(2));
  p.style.opacity=f<0.002?0:1;
  var a=(1-f)*2*Math.PI;
  var kn=$('knob'); kn.setAttribute('cx',(150+132*Math.sin(a)).toFixed(2)); kn.setAttribute('cy',(150-132*Math.cos(a)).toFixed(2));
}
function renderUI(){
  var p=st.phase, idx=ORDER.indexOf(p);
  document.documentElement.setAttribute('data-phase',p);
  [].forEach.call($('seg').querySelectorAll('button'),function(b){b.classList.toggle('on',b.dataset.p===p);});
  $('seg').querySelector('i').style.transform='translateX('+(idx*100)+'%)';
  $('play').classList.toggle('on',st.running);
  $('reset').disabled=untouched();
  var mid=!st.running&&st.remain<st.total;
  $('stage').classList.toggle('paused',mid);
  var n=Math.min(st.done+1,cfg.every);
  $('pl').textContent = p==='focus' ? 'Session '+n+' of '+cfg.every : NAMES[p];
  var sub;
  if(st.running){ sub='Ends at '+new Date(st.endAt).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }
  else if(mid) sub='Paused';
  else sub = p==='focus' ? 'Ready when you are' : (p==='short'?'Stretch, breathe, sip water':'You earned a real rest');
  $('sub').textContent=sub;
  // dots
  var D=$('dots');
  if(D.children.length!==cfg.every){ D.innerHTML=''; for(var i=0;i<cfg.every;i++) D.appendChild(document.createElement('b')); }
  [].forEach.call(D.children,function(b,i){
    b.classList.toggle('on',i<st.done);
    b.classList.toggle('cur',p==='focus'&&i===st.done);
  });
  D.classList.toggle('run',st.running&&p==='focus');
  lastTxt=''; renderTime();
}
function streak(){
  var i=0,c=0;
  if(!(log[dkey(dayBack(0))]&&log[dkey(dayBack(0))].n>0)) i=1;
  for(;i<400;i++){ var e=log[dkey(dayBack(i))]; if(e&&e.n>0) c++; else break; }
  return c;
}
function fmtMin(m){ return m<60 ? m+'<em>min</em>' : Math.floor(m/60)+'<em>h</em>'+(m%60)+'<em>m</em>'; }
var lastN=-1;
function renderStats(){
  var t=log[dkey(new Date())]||{n:0,m:0}, s=streak();
  $('tN').textContent=t.n; $('tM').textContent=t.m; $('tS').textContent=s;
  if(lastN!==-1&&t.n!==lastN){ ['tN','tM','tS'].forEach(function(id){var e=$(id); e.classList.remove('pop'); void e.offsetWidth; e.classList.add('pop');}); }
  lastN=t.n;
  $('sToday').innerHTML=t.n+'<em>'+(t.n===1?'session':'sessions')+'</em>';
  $('sTime').innerHTML=fmtMin(t.m);
  $('sStreak').innerHTML=s+'<em>'+(s===1?'day':'days')+'</em>';
  $('sAll').innerHTML=all.n+'<em>'+(all.n===1?'session':'sessions')+'</em>';
}
function renderChart(animate){
  var B=$('bars'), days=[], max=30, wm=0, wn=0, i;
  for(i=6;i>=0;i--){ var d=dayBack(i), e=log[dkey(d)]||{n:0,m:0}; days.push({d:d,m:e.m,n:e.n,t:i===0}); if(e.m>max)max=e.m; wm+=e.m; wn+=e.n; }
  B.innerHTML='';
  days.forEach(function(x){
    var c=document.createElement('div'); c.className='c'+(x.t?' t':'')+(x.m?'':' z');
    c.innerHTML='<div class="n">'+(x.m?(x.m<60?x.m+'m':(Math.round(x.m/6)/10)+'h'):'')+'</div><div class="b"></div><div class="d">'+'SMTWTFS'.charAt(x.d.getDay())+'</div>';
    B.appendChild(c);
    var bar=c.querySelector('.b'), h=x.m?Math.max(8,Math.round(x.m/max*108)):4;
    if(animate){ requestAnimationFrame(function(){ requestAnimationFrame(function(){ bar.style.height=h+'px'; }); }); } else bar.style.height=h+'px';
  });
  $('wk').textContent = wn ? wn+(wn===1?' session · ':' sessions · ')+(wm<60?wm+' min':Math.floor(wm/60)+'h '+(wm%60)+'m') : 'No sessions yet';
}

/* ---------- timer engine (timestamp based) ---------- */
function frame(){
  raf=0;
  if(!st.running||bg) return;
  if(Date.now()>=st.endAt){ complete(); return; }
  renderTime();
  raf=requestAnimationFrame(frame);
}
function kick(){ if(!raf&&st.running&&!bg) raf=requestAnimationFrame(frame); }
function arm(){
  clearTimeout(endT);
  if(!st.running) return;
  endT=setTimeout(function(){ if(!st.running) return; if(Date.now()>=st.endAt) complete(); else arm(); }, Math.min(Math.max(0,st.endAt-Date.now())+25, 2000000000));
}
function start(quiet){
  if(st.running) return;
  if(st.remain<=0){ st.remain=st.total=dur(st.phase); }
  st.endAt=Date.now()+st.remain; st.running=true;
  if(!quiet) iPhone.haptic('medium');
  arm(); kick(); renderUI(); saveSt();
}
function pause(){
  if(!st.running) return;
  st.remain=Math.max(0,st.endAt-Date.now()); st.running=false; clearTimeout(endT);
  iPhone.haptic('light'); renderUI(); saveSt();
}
function setPhase(p){
  st.phase=p; st.running=false; clearTimeout(endT);
  st.total=st.remain=dur(p);
  renderUI();
}
function credit(at,min){
  var key=dkey(new Date(at)); var e=log[key]||(log[key]={n:0,m:0});
  e.n++; e.m+=min; all.n++; all.m+=min;
  var cut=dkey(dayBack(400));
  Object.keys(log).forEach(function(x){ if(x<cut) delete log[x]; });
  saveLog();
}
function complete(){
  var at=st.endAt||Date.now(), late=Date.now()-at, was=st.phase, next, msg;
  st.running=false; clearTimeout(endT);
  if(was==='focus'){
    credit(at,Math.max(1,Math.round(st.total/60000)));
    st.done++;
    if(st.done>=cfg.every){ next='long'; msg='All '+cfg.every+' sessions done! Enjoy a '+cfg.long+' minute long break.'; }
    else { next='short'; msg='Session '+st.done+' of '+cfg.every+' complete. Take a '+cfg.short+' minute break.'; }
  }else{
    if(was==='long'||st.done>=cfg.every) st.done=0;
    next='focus'; msg="Break's over. Ready for session "+(st.done+1)+'?';
  }
  if(cfg.sound) iPhone.sound('tone:Note');
  iPhone.haptic('success');
  iPhone.notify('Focus Timer',msg);
  var S=$('stage'); S.classList.remove('done'); void S.offsetWidth; S.classList.add('done');
  setTimeout(function(){ S.classList.remove('done'); },950);
  setPhase(next);
  renderStats();
  if($('shStats').classList.contains('on')) renderChart(false);
  if(cfg.auto&&late<15000) start(true); else saveSt();
}

/* ---------- alert ---------- */
var alertCb=null;
function ask(title,msg,yes,cb){ $('aT').textContent=title; $('aM').textContent=msg; $('aYes').textContent=yes; alertCb=cb; $('alert').classList.add('on'); iPhone.haptic('warning'); }
$('aNo').addEventListener('click',function(){ $('alert').classList.remove('on'); alertCb=null; });
$('aYes').addEventListener('click',function(){ $('alert').classList.remove('on'); var f=alertCb; alertCb=null; if(f) f(); });
function guarded(fn){
  var elapsed=st.total-remaining();
  if(st.phase==='focus'&&elapsed>=60000) ask('End this session?','You are '+Math.floor(elapsed/60000)+' min into this focus session. It will not be counted.','End',fn);
  else fn();
}

/* ---------- controls ---------- */
$('play').addEventListener('click',function(){ if(st.running) pause(); else start(); });
$('reset').addEventListener('click',function(){
  guarded(function(){ iPhone.haptic('medium'); setPhase(st.phase); saveSt(); });
});
$('skip').addEventListener('click',function(){
  guarded(function(){
    iPhone.haptic('medium');
    var was=st.phase;
    if(was!=='focus'&&(was==='long'||st.done>=cfg.every)) st.done=0;
    setPhase(was==='focus'?'short':'focus'); saveSt();
  });
});
[].forEach.call($('seg').querySelectorAll('button'),function(b){
  b.addEventListener('click',function(){
    var p=b.dataset.p; if(p===st.phase) return;
    guarded(function(){ iPhone.haptic('selection'); setPhase(p); saveSt(); });
  });
});
(function(){
  var box=$('ringBox'), S=$('stage');
  box.addEventListener('pointerdown',function(){ S.classList.add('press'); });
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){ box.addEventListener(ev,function(){ S.classList.remove('press'); }); });
  box.addEventListener('click',function(){ if(st.running) pause(); else start(); });
})();
window.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key===' '||e.key==='Enter'){ e.preventDefault(); if(document.activeElement&&document.activeElement.blur) document.activeElement.blur(); if($('alert').classList.contains('on')||curSheet) return; if(st.running) pause(); else start(); }
  else if(e.key==='Escape'){ if($('alert').classList.contains('on')) $('aNo').click(); else if(curSheet) curSheet.close(); }
});

/* ---------- sheets ---------- */
var curSheet=null;
function Sheet(id){
  var el=$(id), bd=$('backdrop'), self={};
  self.open=function(){ if(curSheet&&curSheet!==self) curSheet.close(); curSheet=self; el.classList.add('on'); bd.classList.add('on'); iPhone.haptic('light'); };
  self.close=function(){ if(curSheet===self) curSheet=null; el.classList.remove('on'); el.style.transform=''; if(!curSheet) bd.classList.remove('on'); };
  var hd=el.querySelector('.sh-head'), y0=0, pid=null, dy=0, t0=0;
  hd.addEventListener('pointerdown',function(e){ if(e.target.closest('button')) return; pid=e.pointerId; y0=e.clientY; dy=0; t0=Date.now(); try{hd.setPointerCapture(pid);}catch(err){} el.style.transition='none'; });
  hd.addEventListener('pointermove',function(e){ if(e.pointerId!==pid) return; dy=Math.max(0,e.clientY-y0); el.style.transform='translateY('+dy+'px)'; });
  function up(e){ if(e.pointerId!==pid) return; pid=null; el.style.transition=''; el.style.transform=''; if(dy>110||(dy>30&&dy/Math.max(1,Date.now()-t0)>0.6)) self.close(); }
  hd.addEventListener('pointerup',up); hd.addEventListener('pointercancel',up);
  el.querySelector('[data-close]').addEventListener('click',function(){ self.close(); });
  return self;
}
var shSet=Sheet('shSet'), shStats=Sheet('shStats');
$('backdrop').addEventListener('click',function(){ if(curSheet) curSheet.close(); });
$('bSet').addEventListener('click',function(){ renderSettings(); shSet.open(); });
$('bStats').addEventListener('click',function(){ renderStats(); renderChart(true); shStats.open(); });

/* ---------- settings ---------- */
var ROWS=[['focus','Focus','min'],['short','Short break','min'],['long','Long break','min'],['every','Long break after','sessions']];
var rowEls={};
ROWS.forEach(function(r){
  var key=r[0], row=document.createElement('div'); row.className='rowi';
  row.innerHTML='<div class="t">'+r[1]+'</div><div class="v"></div><div class="stepper"><button aria-label="Less">−</button><span></span><button aria-label="More">+</button></div>';
  var btns=row.querySelectorAll('button');
  rowEls[key]={v:row.querySelector('.v'),m:btns[0],p:btns[1],unit:r[2]};
  hold(btns[0],function(){ return step(key,-1); }); hold(btns[1],function(){ return step(key,1); });
  $('gLen').appendChild(row);
});
function step(key,d){
  var n=cfg[key]+d;
  if(n<LIM[key][0]||n>LIM[key][1]){ iPhone.haptic('warning'); return false; }
  cfg[key]=n; iPhone.haptic('light');
  var v=rowEls[key].v; v.classList.remove('bump'); void v.offsetWidth; v.classList.add('bump');
  applyCfg(); return true;
}
function applyCfg(){
  if(untouched()){ st.total=st.remain=dur(st.phase); }
  renderSettings(); renderUI(); saveCfg(); saveSt();
}
function hold(btn,fn){
  var t=0,iv=0;
  function stop(){ clearTimeout(t); clearInterval(iv); }
  btn.addEventListener('pointerdown',function(e){ e.preventDefault(); stop(); fn(); t=setTimeout(function(){ iv=setInterval(function(){ if(!fn()) stop(); },90); },420); });
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){ btn.addEventListener(ev,stop); });
}
function renderSettings(){
  ROWS.forEach(function(r){
    var k=r[0], o=rowEls[k];
    o.v.textContent=cfg[k]+' '+(k==='every'?'sessions':'min');
    o.m.disabled=cfg[k]<=LIM[k][0]; o.p.disabled=cfg[k]>=LIM[k][1];
  });
  [].forEach.call(document.querySelectorAll('[data-sw]'),function(row){ row.querySelector('.switch').classList.toggle('on',!!cfg[row.dataset.sw]); });
}
[].forEach.call(document.querySelectorAll('[data-sw]'),function(row){
  row.addEventListener('click',function(){
    var k=row.dataset.sw; cfg[k]=!cfg[k]; iPhone.haptic('medium');
    if(k==='sound'&&cfg[k]) iPhone.sound('tone:Note');
    renderSettings(); saveCfg();
  });
});
$('defaults').addEventListener('click',function(){
  for(var k in DEF) cfg[k]=DEF[k];
  iPhone.haptic('medium'); applyCfg();
});

/* ---------- mouse drag-to-scroll inside sheets ---------- */
[].forEach.call(document.querySelectorAll('.sh-body'),function(el){
  var sy=0,s0=0,id=null,moved=false;
  el.addEventListener('pointerdown',function(e){ if(e.pointerType!=='mouse'||e.target.closest('button,.stepper')) return; id=e.pointerId; sy=e.clientY; s0=el.scrollTop; moved=false; });
  el.addEventListener('pointermove',function(e){ if(e.pointerId!==id) return; var d=e.clientY-sy; if(!moved&&Math.abs(d)>6){ moved=true; try{el.setPointerCapture(id);}catch(err){} } if(moved) el.scrollTop=s0-d; });
  function up(e){ if(e.pointerId!==id) return; id=null; if(moved){ var kill=function(ev){ev.stopPropagation();ev.preventDefault();}; window.addEventListener('click',kill,true); setTimeout(function(){window.removeEventListener('click',kill,true);},0); } }
  el.addEventListener('pointerup',up); el.addEventListener('pointercancel',up);
});

/* ---------- lifecycle ---------- */
iPhone.onPause(function(){ bg=true; if(raf){ cancelAnimationFrame(raf); raf=0; } saveSt(); /* the end-of-phase timeout stays armed so the chime + notification still fire */ });
iPhone.onResume(function(){
  bg=false;
  if(st.running&&Date.now()>=st.endAt) complete();
  arm(); kick(); renderUI(); renderStats();
});
document.addEventListener('visibilitychange',function(){ if(!document.hidden&&!bg){ if(st.running&&Date.now()>=st.endAt) complete(); kick(); renderUI(); renderStats(); } });
setInterval(function(){ if(!bg&&!st.running) renderStats(); },60000);

renderUI(); renderStats(); renderSettings();
Promise.all([iPhone.storage.get('cfg',null),iPhone.storage.get('st',null),iPhone.storage.get('log',null),iPhone.storage.get('all',null)]).then(function(r){
  var c=r[0], s=r[1], l=r[2], a=r[3], k;
  if(c&&typeof c==='object'){
    for(k in LIM){ if(typeof c[k]==='number'&&isFinite(c[k])) cfg[k]=Math.max(LIM[k][0],Math.min(LIM[k][1],Math.round(c[k]))); }
    if(typeof c.auto==='boolean') cfg.auto=c.auto;
    if(typeof c.sound==='boolean') cfg.sound=c.sound;
  }
  if(l&&typeof l==='object'){ for(k in l){ if(/^\d{4}-\d\d-\d\d$/.test(k)&&l[k]&&l[k].n>=0&&l[k].m>=0) log[k]={n:Math.round(l[k].n),m:Math.round(l[k].m)}; } }
  if(a&&a.n>=0&&a.m>=0) all={n:Math.round(a.n),m:Math.round(a.m)};
  if(s&&NAMES[s.phase]&&isFinite(s.remain)&&isFinite(s.total)&&s.total>0){
    st.phase=s.phase; st.total=s.total; st.remain=Math.max(0,Math.min(s.total,s.remain));
    st.done=Math.max(0,Math.min(cfg.every,Math.round(s.done)||0));
    st.running=!!s.running&&isFinite(s.endAt)&&s.endAt>0; st.endAt=st.running?s.endAt:0;
    if(st.running&&st.endAt-Date.now()>st.total) { st.running=false; st.remain=st.total; }
  }else{ st.total=st.remain=dur(st.phase); }
  if(untouched()) st.total=st.remain=dur(st.phase);
  lastN=-1;
  if(st.running&&Date.now()>=st.endAt) complete();
  else { arm(); kick(); }
  renderUI(); renderStats(); renderSettings();
}).catch(function(){});
})();
</script>
