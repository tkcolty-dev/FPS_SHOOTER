<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>StateLocater — all 50 states & capitals</title>
<meta name="theme-color" content="#fbf7ee">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=9">
</head>
<body>
<header id="top">
  <div class="brand"><span class="logo">🗺️</span><span>StateLocater</span></div>
  <div class="stats">
    <span class="stat" title="Day of your 4-week plan">📅 <b id="st-day">Day 1</b></span>
    <span class="stat" title="Streak">🔥 <b id="st-streak">0</b></span>
    <span class="stat" title="XP">⭐ <b id="st-xp">0</b></span>
    <button id="acct-btn" class="pill">Sign in</button>
  </div>
</header>
<main id="view"></main>
<nav id="nav">
  <button data-tab="today" class="on"><span>📝</span>Today</button>
  <button data-tab="play"><span>🎮</span>Play</button>
  <button data-tab="map"><span>🗺️</span>Map</button>
  <button data-tab="test"><span>🏁</span>Test</button>
  <button data-tab="plan"><span>📅</span>Plan</button>
</nav>
<div id="modal" class="hidden"></div>
<div id="toast"></div>
<script src="app.js?v=11"></script>
</body>
</html>
