<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
<meta name="theme-color" content="#f6f7f4" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Tote" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<title>Tote — Grocery Lists</title>
<style>
  :root{
    --bg:#f6f7f4;
    --surface:#ffffff;
    --surface2:#eef1ec;
    --line:#e4e8e0;
    --txt:#16241a;
    --muted:#6b7a6e;
    --faint:#9aa79c;
    --accent:#15a34a;
    --accent-hover:#138a3f;
    --accent-soft:#e7f6ec;
    --warn:#dc2626;
    --warn-soft:#fef2f2;
    --shadow-sm:0 1px 2px rgba(20,40,25,.05);
    --shadow-md:0 8px 22px -10px rgba(20,40,25,.22),0 2px 6px -3px rgba(20,40,25,.08);
    --shadow-lg:0 24px 48px -18px rgba(20,40,25,.30);
    --radius:15px;
    --radius-lg:20px;
    --ease:cubic-bezier(.32,.72,0,1);
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bot:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%;height:100dvh}
  body{
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);color:var(--txt);
    overflow:hidden;position:fixed;width:100%;
    -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;letter-spacing:-.01em;
  }
  #app{
    height:100%;height:100dvh;display:flex;flex-direction:column;
    max-width:600px;margin:0 auto;width:100%;
    padding-top:var(--safe-top);position:relative;
  }
  .scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  button{font-family:inherit}

  /* ---------- Header ---------- */
  header{display:flex;align-items:center;gap:10px;padding:14px 16px 8px}
  .icon-btn{
    width:42px;height:42px;border-radius:13px;border:1px solid var(--line);
    background:var(--surface);color:var(--muted);display:grid;place-items:center;
    cursor:pointer;box-shadow:var(--shadow-sm);flex:none;
    transition:transform .12s var(--ease),background .15s,color .15s;
  }
  .icon-btn:active{transform:scale(.9);background:var(--surface2);color:var(--txt)}
  .icon-btn svg{width:21px;height:21px}
  .grow{flex:1}
  .share-pill{
    display:flex;align-items:center;gap:7px;height:42px;padding:0 16px;border-radius:13px;
    border:none;background:var(--accent);color:#fff;font-weight:700;font-size:15px;cursor:pointer;
    box-shadow:var(--shadow-sm);transition:transform .12s var(--ease),background .15s;
  }
  .share-pill:active{transform:scale(.94);background:var(--accent-hover)}
  .share-pill svg{width:18px;height:18px}

  /* ---------- Title block ---------- */
  .titlewrap{padding:4px 18px 8px}
  .titlerow{display:flex;align-items:center;gap:11px}
  .demoji{
    font-size:30px;line-height:1;cursor:pointer;flex:none;width:46px;height:46px;
    display:grid;place-items:center;border-radius:14px;background:var(--accent-soft);
    transition:transform .12s var(--ease)
  }
  .demoji:active{transform:scale(.9)}
  .titlerow input{
    flex:1;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1;
    border:none;background:none;color:var(--txt);width:100%;padding:2px 0;font-family:inherit
  }
  .titlerow input:focus{outline:none}
  .subrow{display:flex;align-items:center;gap:9px;margin-top:9px;font-size:13px;color:var(--muted)}
  .mini-bar{flex:1;height:6px;border-radius:5px;background:var(--surface2);overflow:hidden;max-width:200px}
  .mini-bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .45s var(--ease)}

  /* ---------- Items ---------- */
  .listbody{padding:2px 16px 120px}
  .grouphead{
    display:flex;align-items:center;gap:7px;font-size:12px;font-weight:750;
    color:var(--faint);text-transform:uppercase;letter-spacing:.05em;padding:16px 4px 7px;
  }
  ul.items{list-style:none}
  li.item{
    display:flex;align-items:center;gap:13px;background:var(--surface);
    border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:8px;
    box-shadow:var(--shadow-sm);cursor:pointer;position:relative;
    transition:transform .12s var(--ease),opacity .25s,background .25s;
  }
  li.item:active{transform:scale(.99);background:#fcfdfb}
  .check{
    width:26px;height:26px;border-radius:50%;border:2.2px solid var(--line);flex:none;
    display:grid;place-items:center;transition:all .2s var(--ease);
  }
  .check svg{width:14px;height:14px;opacity:0;transform:scale(.4);transition:all .2s var(--ease)}
  li.item.done .check{background:var(--accent);border-color:var(--accent)}
  li.item.done .check svg{opacity:1;transform:scale(1)}
  .iname{flex:1;font-size:16.5px;font-weight:550;letter-spacing:-.01em;line-height:1.25;transition:color .2s}
  li.item.done .iname{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line)}
  .qty{font-size:12.5px;font-weight:700;color:var(--accent);background:var(--accent-soft);
    border-radius:7px;padding:3px 8px;flex:none}
  li.item.done .qty{color:var(--faint);background:var(--surface2)}
  .del{
    width:30px;height:30px;border-radius:9px;border:none;background:transparent;color:var(--faint);
    display:grid;place-items:center;flex:none;cursor:pointer;opacity:.5;
    transition:opacity .15s,background .15s,color .15s
  }
  .del:active{background:var(--warn-soft);color:var(--warn);opacity:1}
  .del svg{width:17px;height:17px}
  .gotdiv{
    display:flex;align-items:center;gap:9px;color:var(--faint);font-size:12.5px;font-weight:700;
    padding:18px 4px 8px;text-transform:uppercase;letter-spacing:.04em
  }
  .gotdiv .ln{flex:1;height:1px;background:var(--line)}
  .gotdiv svg{width:15px;height:15px;flex:none}

  /* ---------- empty ---------- */
  .empty{text-align:center;padding:38px 30px;color:var(--muted)}
  .empty .e-ico{font-size:50px;margin-bottom:6px}
  .empty h3{font-size:18px;color:var(--txt);font-weight:750;margin-bottom:5px;letter-spacing:-.02em}
  .empty p{font-size:14.5px;line-height:1.5;max-width:280px;margin:0 auto}

  /* ---------- add bar ---------- */
  .addbar{
    position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(12px + var(--safe-bot));
    background:linear-gradient(to top,var(--bg) 64%,rgba(246,247,244,0));z-index:15;
  }
  .addbar .row{
    display:flex;gap:10px;background:var(--surface);border:1px solid var(--line);
    border-radius:16px;padding:6px 6px 6px 16px;box-shadow:var(--shadow-md);align-items:center;
  }
  .addbar input{flex:1;border:none;background:none;font-size:16.5px;color:var(--txt);
    font-family:inherit;padding:11px 0;letter-spacing:-.01em}
  .addbar input:focus{outline:none}
  .addbar input::placeholder{color:var(--faint)}
  .add-go{
    width:44px;height:44px;border-radius:12px;border:none;background:var(--accent);color:#fff;
    display:grid;place-items:center;cursor:pointer;flex:none;
    transition:transform .12s var(--ease),background .15s;
  }
  .add-go:active{transform:scale(.9);background:var(--accent-hover)}
  .add-go svg{width:23px;height:23px}

  /* ---------- shared banner ---------- */
  .banner{
    margin:2px 18px 4px;background:var(--accent-soft);border:1px solid #cdeccf;
    border-radius:14px;padding:11px 14px;display:flex;gap:10px;align-items:flex-start;
  }
  .banner .bico{font-size:17px;line-height:1.2}
  .banner .bt{font-size:13px;line-height:1.45;color:#1c5a30}
  .banner .bt b{font-weight:750}

  /* ---------- sheets ---------- */
  .scrim{position:fixed;inset:0;background:rgba(20,40,25,.34);opacity:0;pointer-events:none;
    transition:opacity .28s var(--ease);z-index:40;backdrop-filter:blur(2px)}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
    border-radius:24px 24px 0 0;padding:8px 20px calc(20px + var(--safe-bot));
    transform:translateY(102%);transition:transform .34s var(--ease);
    max-width:600px;margin:0 auto;box-shadow:var(--shadow-lg);max-height:86dvh;overflow-y:auto;
  }
  .sheet.on{transform:translateY(0)}
  .grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 14px}
  .sheet h2{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px;text-align:center}
  .sheet .sub{font-size:13.5px;color:var(--muted);text-align:center;margin-bottom:16px;line-height:1.45}
  .emojirow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px;justify-content:center}
  .emojirow button{width:48px;height:48px;border-radius:13px;border:1.5px solid var(--line);
    background:var(--surface);font-size:24px;cursor:pointer;transition:all .14s var(--ease)}
  .emojirow button.sel{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.05)}
  .emojirow button:active{transform:scale(.92)}
  .btn{
    width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:700;
    cursor:pointer;letter-spacing:-.01em;display:flex;align-items:center;justify-content:center;gap:9px;
    transition:transform .12s var(--ease),background .15s;
  }
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);color:#fff}
  .btn.primary:active{background:var(--accent-hover)}
  .btn.soft{background:var(--surface2);color:var(--txt);margin-top:10px}
  .btn.danger{background:var(--warn-soft);color:var(--warn);margin-top:10px}
  .btn svg{width:20px;height:20px}

  /* lists switcher */
  .lrow{
    display:flex;align-items:center;gap:13px;padding:13px 14px;border-radius:14px;
    border:1.5px solid var(--line);margin-bottom:9px;cursor:pointer;background:var(--surface);
    transition:transform .12s var(--ease),border-color .15s,background .15s;
  }
  .lrow:active{transform:scale(.99)}
  .lrow.active{border-color:var(--accent);background:var(--accent-soft)}
  .lrow .le{width:42px;height:42px;border-radius:12px;background:var(--surface2);display:grid;
    place-items:center;font-size:22px;flex:none}
  .lrow.active .le{background:#fff}
  .lrow .ltx{flex:1;min-width:0}
  .lrow .ln2{font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  .lrow .lm{font-size:12.5px;color:var(--muted);margin-top:2px}
  .lrow .tick{color:var(--accent);flex:none}
  .lrow .tick svg{width:22px;height:22px}
  .ldel{width:34px;height:34px;border-radius:10px;border:none;background:transparent;color:var(--faint);
    display:grid;place-items:center;cursor:pointer;flex:none}
  .ldel:active{background:var(--warn-soft);color:var(--warn)}
  .ldel svg{width:18px;height:18px}

  /* menu rows */
  .mrow{display:flex;align-items:center;gap:13px;width:100%;padding:15px 6px;border:none;background:none;
    cursor:pointer;font-size:16px;font-weight:600;color:var(--txt);border-bottom:1px solid var(--line);
    text-align:left}
  .mrow:last-of-type{border-bottom:none}
  .mrow .mi{width:24px;display:grid;place-items:center;color:var(--muted);flex:none}
  .mrow .mi svg{width:21px;height:21px}
  .mrow.warn{color:var(--warn)} .mrow.warn .mi{color:var(--warn)}
  .mrow .grow{flex:1}
  .toggle{width:46px;height:28px;border-radius:16px;background:var(--surface2);position:relative;
    flex:none;transition:background .2s}
  .toggle.on{background:var(--accent)}
  .toggle i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;
    box-shadow:var(--shadow-sm);transition:transform .2s var(--ease)}
  .toggle.on i{transform:translateX(18px)}

  /* toast */
  .toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-bot));transform:translate(-50%,140%);
    background:#16241a;color:#fff;border-radius:14px;padding:13px 16px;z-index:60;display:flex;
    align-items:center;gap:14px;font-size:14px;font-weight:550;box-shadow:var(--shadow-lg);
    transition:transform .34s var(--ease);max-width:90%}
  .toast.on{transform:translate(-50%,0)}
  .toast button{background:none;border:none;color:#7ee2a0;font-weight:700;font-size:14px;cursor:pointer;flex:none}

  .removing{animation:fade .25s var(--ease) forwards}
  @keyframes fade{to{opacity:0;transform:translateX(40px) scale(.96);height:0;margin:0;padding-top:0;padding-bottom:0}}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
  .pop{animation:pop .3s var(--ease)}
  .justadded{animation:flash .9s var(--ease)}
  @keyframes flash{0%{background:var(--accent-soft);border-color:#bfe6c8}100%{background:var(--surface);border-color:var(--line)}}
  .fadein{animation:fadein .3s var(--ease)}
  @keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app"></div>
<div class="scrim" id="scrim"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ============================ data ============================ */
const LS = "tote.db.v1";
const CATS = [
  {k:"frozen",   label:"Frozen",         e:"🧊"},
  {k:"produce",  label:"Produce",        e:"🥬"},
  {k:"dairy",    label:"Dairy & Eggs",   e:"🥚"},
  {k:"meat",     label:"Meat & Seafood", e:"🍗"},
  {k:"bakery",   label:"Bakery",         e:"🍞"},
  {k:"pantry",   label:"Pantry & Canned",e:"🥫"},
  {k:"snacks",   label:"Snacks & Sweets",e:"🍪"},
  {k:"drinks",   label:"Drinks",         e:"🧃"},
  {k:"household",label:"Household",       e:"🧻"},
  {k:"other",    label:"Other",          e:"🛒"},
];
const CAT_ORDER = ["produce","bakery","meat","dairy","frozen","pantry","snacks","drinks","household","other"];
const CAT = Object.fromEntries(CATS.map(c=>[c.k,c]));
const CATWORDS = [
  ["frozen",  ["frozen","ice cream","ice-cream","popsicle","waffle"]],
  ["produce", ["apple","banana","lettuce","spinach","kale","tomato","onion","garlic","potato","carrot","pepper","cucumber","broccoli","celery","lemon","lime","orange","grape","berr","strawber","blueber","avocado","mushroom","zucchini","squash","cilantro","parsley","basil","herb","ginger","corn","cabbage","cauliflower","pear","peach","plum","mango","melon","salad","greens","fruit","veg"]],
  ["dairy",   ["milk","egg","cheese","butter","yogurt","yoghurt","cream","sour cream","cottage","mozzarella","cheddar","parmesan","feta","margarine","creamer"]],
  ["meat",    ["chicken","beef","pork","bacon","sausage","steak","turkey","ham","fish","salmon","tuna","shrimp","lamb","ground","mince","ribs","wing","tofu","deli","hot dog"]],
  ["bakery",  ["bread","bagel","bun","roll","croissant","muffin","tortilla","baguette","pita","cake","donut","doughnut","pastry","loaf","naan"]],
  ["pantry",  ["rice","pasta","flour","sugar","oil","olive oil","salt","spice","sauce","ketchup","mustard","mayo","can","canned","beans","soup","broth","stock","cereal","oats","oatmeal","peanut butter","jam","jelly","honey","vinegar","noodle","lentil","quinoa","syrup","baking","yeast","spaghetti","taco","salsa","tea","coffee"]],
  ["snacks",  ["chip","cracker","cookie","candy","chocolate","popcorn","pretzel","nuts","granola","bar","snack","gum","jerky","trail mix"]],
  ["drinks",  ["water","juice","soda","pop","cola","beer","wine","seltzer","kombucha","gatorade","lemonade","sparkling","drink","smoothie"]],
  ["household",["paper towel","toilet paper","tissue","napkin","soap","detergent","dish soap","cleaner","bleach","sponge","trash bag","foil","wrap","ziploc","battery","shampoo","toothpaste","deodorant","razor","lotion","diaper","wipes","laundry"]],
];
const EMOJIS = ["🛒","🧺","🥗","🍝","🥘","🎉","🍕","🏖️","🧁","🌮","🍳","🥑"];

function uid(){ return Math.random().toString(36).slice(2,9) + (performance.now()|0).toString(36); }
function load(){
  let d=null; try{ d=JSON.parse(localStorage.getItem(LS)); }catch(e){}
  if(!d || !Array.isArray(d.lists)) d={lists:[],active:null,groupAisle:false};
  if(typeof d.groupAisle!=="boolean") d.groupAisle=false;
  return d;
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(db)); }catch(e){} }
let db = load();

function ensureList(){
  if(!db.lists.length){
    db.lists.push({id:uid(),name:"Grocery List",emoji:"🛒",items:[],created:Date.now()});
  }
  if(!db.active || !db.lists.some(l=>l.id===db.active)) db.active=db.lists[0].id;
  save();
}
function active(){ return db.lists.find(l=>l.id===db.active) || db.lists[0]; }

/* ---- smart parse ---- */
function parseEntry(raw){
  let name=raw.trim().replace(/\s+/g," "), qty="", m;
  if((m=name.match(/^(\d+)\s+(.+)$/))){ qty=m[1]; name=m[2]; }
  else if((m=name.match(/^(.+?)\s*[x×]\s*(\d+)$/i))){ name=m[1]; qty=m[2]; }
  else if((m=name.match(/^(.+?)\s+(\d+)$/))){ name=m[1]; qty=m[2]; }
  name=name.trim();
  return { name, qty, cat:guessCat(name) };
}
function guessCat(name){
  const n=name.toLowerCase();
  for(const [cat,words] of CATWORDS){ if(words.some(w=>n.includes(w))) return cat; }
  return "other";
}

/* ============================ routing ============================ */
let view="list";          // "list" | "shared"
let shared=null, sharedId=null;
let lastAdded=null;       // id to flash

function boot(){
  const h=location.hash||"";
  if(h.startsWith("#s=")){
    const data=decodeList(h.slice(3));
    if(data){ shared=data; sharedId="tote.sh."+hash32(h.slice(3)); view="shared"; render(); return; }
  }
  ensureList(); view="list"; render();
}

/* ============================ share encode/decode ============================ */
function b64urlEncode(str){
  const u=encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,(_,h)=>String.fromCharCode(parseInt(h,16)));
  return btoa(u).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function b64urlDecode(s){
  s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="=";
  const bin=atob(s); let pct=""; for(let i=0;i<bin.length;i++) pct+="%"+("00"+bin.charCodeAt(i).toString(16)).slice(-2);
  return decodeURIComponent(pct);
}
function hash32(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return h.toString(36); }
function encodeList(l){
  const p={n:l.name,e:l.emoji,i:l.items.map(it=>[it.name,it.qty||"",it.cat||"other"])};
  return b64urlEncode(JSON.stringify(p));
}
function decodeList(code){
  try{
    const p=JSON.parse(b64urlDecode(code));
    if(!p||!Array.isArray(p.i)) return null;
    return { name:p.n||"Shared list", emoji:p.e||"🛒",
      items:p.i.map(a=>({name:String(a[0]||""),qty:String(a[1]||""),cat:a[2]||"other"})).filter(x=>x.name) };
  }catch(e){ return null; }
}
function shareURL(l){ return location.origin+location.pathname+"#s="+encodeList(l); }
function shareText(l,url){
  const lines=l.items.map(it=>"• "+(it.qty?it.qty+"× ":"")+it.name);
  return (l.emoji?l.emoji+" ":"")+l.name+"\n"+lines.join("\n")+"\n\nTap to open & check off:\n"+url;
}

/* ============================ icons / helpers ============================ */
const ICON={
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 3v13"/><path d="M8 7l4-4 4 4"/></svg>',
  lists:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',
  dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>',
  checkw:'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>',
  trash:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-14"/></svg>',
  save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>',
  aisle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="6" rx="1.5"/><rect x="3" y="14" width="18" height="6" rx="1.5"/></svg>',
  broom:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 5l-7 7M11 11l-6 6 2 2 6-6M8 14l2 2"/></svg>',
};
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function el(html){ const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; }
const App=()=>document.getElementById("app");
function stats(items){ const t=items.length,d=items.filter(i=>i.done).length; return {t,d,left:t-d,pct:t?Math.round(d/t*100):0}; }

/* ============================ render ============================ */
function render(){ return view==="shared"?renderShared():renderList(); }

function itemRow(it, gi, done){
  return `<li class="item ${done?'done':''} ${it.id===lastAdded?'justadded':''}" data-id="${it.id}">
    <span class="check">${ICON.checkw}</span>
    <span class="iname">${esc(it.name)}</span>
    ${it.qty?`<span class="qty">${esc(it.qty)}×</span>`:""}
    <button class="del" data-del="${it.id}">${ICON.trash}</button>
  </li>`;
}

function renderList(){
  const l=active();
  const s=stats(l.items);
  let body;
  if(!l.items.length){
    body=`<div class="empty fadein"><div class="e-ico">${esc(l.emoji)}</div>
      <h3>Start your list</h3><p>Type an item below and hit add. Try “milk”, “2 bananas”, or “eggs”.</p></div>`;
  } else if(db.groupAisle){
    const by={}; l.items.forEach(it=>{ (by[it.cat]=by[it.cat]||[]).push(it); });
    body=`<div class="listbody">`+CAT_ORDER.filter(k=>by[k]).map(k=>`
      <div class="grouphead">${CAT[k].e} ${esc(CAT[k].label)}</div>
      <ul class="items">${by[k].sort((a,b)=>a.done-b.done).map(it=>itemRow(it,0,it.done)).join("")}</ul>`).join("")+`</div>`;
  } else {
    const todo=l.items.filter(i=>!i.done), got=l.items.filter(i=>i.done);
    body=`<div class="listbody">
      <ul class="items">${todo.map(it=>itemRow(it,0,false)).join("")}</ul>
      ${got.length?`<div class="gotdiv">${ICON.check.replace('currentColor','#9aa79c')} In the cart · ${got.length}<span class="ln"></span></div>
        <ul class="items">${got.map(it=>itemRow(it,0,true)).join("")}</ul>`:""}
    </div>`;
  }

  App().innerHTML=`
    <header>
      <button class="icon-btn" id="lists" title="My lists">${ICON.lists}</button>
      <div class="grow"></div>
      <button class="share-pill" id="share">${ICON.share}Share</button>
      <button class="icon-btn" id="menu">${ICON.dots}</button>
    </header>
    <div class="titlewrap">
      <div class="titlerow">
        <span class="demoji" id="emoji">${esc(l.emoji)}</span>
        <input id="title" value="${esc(l.name)}" spellcheck="false"/>
      </div>
      <div class="subrow">
        ${s.t?`<span>${s.left? s.left+" to get":"All done 🎉"}</span><div class="mini-bar"><i style="width:${s.pct}%"></i></div>`
             :`<span>Empty list</span>`}
      </div>
    </div>
    <div class="scroll" id="scroll">${body}</div>
    <div class="addbar">
      <div class="row">
        <input id="add" placeholder="Add item…" autocomplete="off" autocapitalize="words" enterkeyhint="done"/>
        <button class="add-go" id="addGo">${ICON.plus}</button>
      </div>
    </div>`;
  lastAdded=null;

  App().querySelector("#lists").onclick=listsSheet;
  App().querySelector("#menu").onclick=()=>menuSheet(l);
  App().querySelector("#emoji").onclick=()=>emojiSheet(l);
  App().querySelector("#share").onclick=()=>doShare(l);
  const title=App().querySelector("#title");
  title.onchange=()=>{ const v=title.value.trim(); if(v){l.name=v;save();} else title.value=l.name; };
  bindRows(l);
  const add=App().querySelector("#add");
  const submit=()=>{
    const v=add.value; if(!v.trim()) return;
    const {name,qty,cat}=parseEntry(v);
    const it={id:uid(),name,qty,cat,done:false};
    l.items.unshift(it); save(); lastAdded=it.id;
    add.value=""; renderList();
    const a=App().querySelector("#add"); a.focus();
    App().querySelector("#scroll").scrollTop=0;
  };
  App().querySelector("#addGo").onclick=submit;
  add.addEventListener("keydown",e=>{ if(e.key==="Enter"){ e.preventDefault(); submit(); }});
}

function bindRows(l){
  App().querySelectorAll("li.item").forEach(row=>{
    const id=row.dataset.id;
    row.addEventListener("click",e=>{
      if(e.target.closest(".del")) return;
      const it=l.items.find(x=>x.id===id); if(!it) return;
      it.done=!it.done; save();
      row.classList.toggle("done",it.done);
      if(it.done) row.querySelector(".check").classList.add("pop");
      clearTimeout(bindRows._t); bindRows._t=setTimeout(()=>{ if(view==="list") renderList(); },300);
    });
  });
  App().querySelectorAll("[data-del]").forEach(b=>{
    b.addEventListener("click",e=>{
      e.stopPropagation();
      const id=b.dataset.del, idx=l.items.findIndex(x=>x.id===id);
      if(idx<0) return;
      const removed=l.items[idx];
      b.closest("li.item").classList.add("removing");
      l.items.splice(idx,1); save();
      toast(`Removed “${removed.name}”`,"Undo",()=>{ l.items.splice(Math.min(idx,l.items.length),0,removed); save(); renderList(); });
      setTimeout(()=>{ if(view==="list") renderList(); },240);
    });
  });
}

/* ---------------- share action (one tap) ---------------- */
async function doShare(l){
  if(!l.items.length){ toast("Add some items first"); return; }
  const url=shareURL(l), txt=shareText(l,url);
  try{
    if(navigator.share){ await navigator.share({title:l.name,text:txt}); return; }
  }catch(e){ if(e&&e.name==="AbortError") return; }
  try{ await navigator.clipboard.writeText(url); toast("Link copied — paste it in a text ✓"); }
  catch(e){ fallbackCopy(url); }
}

/* ---------------- shared (recipient snapshot) ---------------- */
function loadSharedChecks(){ try{ return JSON.parse(localStorage.getItem(sharedId))||{}; }catch(e){ return {}; } }
function saveSharedChecks(m){ try{ localStorage.setItem(sharedId,JSON.stringify(m)); }catch(e){} }

function renderShared(){
  const checks=loadSharedChecks();
  const items=shared.items.map((it,i)=>({...it,done:!!checks[i],oi:i}));
  const s=stats(items);
  const todo=items.filter(i=>!i.done), got=items.filter(i=>i.done);
  const rowS=(it)=>`<li class="item ${it.done?'done':''}" data-oi="${it.oi}">
    <span class="check">${ICON.checkw}</span><span class="iname">${esc(it.name)}</span>
    ${it.qty?`<span class="qty">${esc(it.qty)}×</span>`:""}</li>`;
  App().innerHTML=`
    <header>
      <div style="display:flex;align-items:center;gap:9px;font-weight:800;font-size:20px;letter-spacing:-.03em">
        <img src="icon.svg" style="width:28px;height:28px;border-radius:8px"/>Tote</div>
      <div class="grow"></div>
      <button class="share-pill" id="copyMine" style="background:var(--surface);color:var(--accent);border:1px solid var(--line)">${ICON.save}Save</button>
    </header>
    <div class="titlewrap">
      <div class="titlerow"><span class="demoji">${esc(shared.emoji)}</span>
        <span style="font-size:24px;font-weight:800;letter-spacing:-.03em">${esc(shared.name)}</span></div>
      <div class="subrow"><span>${s.left} to get</span><div class="mini-bar"><i style="width:${s.pct}%"></i></div></div>
    </div>
    <div class="banner"><span class="bico">🔗</span>
      <span class="bt"><b>Shared with you.</b> Check things off as you shop — saved on your phone only, won’t change the sender’s list.</span></div>
    <div class="scroll"><div class="listbody">
      <ul class="items">${todo.map(rowS).join("")}</ul>
      ${got.length?`<div class="gotdiv">${ICON.check.replace('currentColor','#9aa79c')} In the cart · ${got.length}<span class="ln"></span></div>
        <ul class="items">${got.map(rowS).join("")}</ul>`:""}
    </div></div>`;
  App().querySelectorAll("li.item").forEach(row=>{
    row.addEventListener("click",()=>{
      const oi=+row.dataset.oi, m=loadSharedChecks(); m[oi]=!m[oi]; saveSharedChecks(m);
      row.classList.toggle("done",!!m[oi]);
      if(m[oi]) row.querySelector(".check").classList.add("pop");
      clearTimeout(renderShared._t); renderShared._t=setTimeout(renderShared,300);
    });
  });
  App().querySelector("#copyMine").onclick=()=>{
    ensureList();
    const l={id:uid(),name:shared.name,emoji:shared.emoji,
      items:shared.items.map(it=>({id:uid(),name:it.name,qty:it.qty,cat:it.cat||guessCat(it.name),done:false})),
      created:Date.now()};
    db.lists.unshift(l); db.active=l.id; save();
    history.replaceState(null,"",location.pathname);
    view="list"; toast("Saved to your lists ✓"); render();
  };
}

/* ============================ sheets ============================ */
const scrim=document.getElementById("scrim");
let curSheet=null;
function openSheet(node){
  closeSheet(); curSheet=node; document.body.appendChild(node);
  requestAnimationFrame(()=>{ scrim.classList.add("on"); node.classList.add("on"); });
  scrim.onclick=closeSheet;
}
function closeSheet(){ scrim.classList.remove("on"); const n=curSheet; curSheet=null;
  if(n){ n.classList.remove("on"); setTimeout(()=>n.remove(),340); } }

function listsSheet(){
  const node=el(`<div class="sheet"><div class="grab"></div>
    <h2>My lists</h2><div class="sub">Tap to switch. Most people only need one.</div>
    <div id="lwrap"></div>
    <button class="btn primary" id="newL">${ICON.plus}New list</button></div>`);
  const wrap=node.querySelector("#lwrap");
  db.lists.forEach(l=>{
    const s=stats(l.items);
    const r=el(`<div class="lrow ${l.id===db.active?'active':''}" data-id="${l.id}">
      <div class="le">${esc(l.emoji)}</div>
      <div class="ltx"><div class="ln2">${esc(l.name)}</div>
        <div class="lm">${s.t?`${s.left} to get · ${s.t} item${s.t>1?'s':''}`:"Empty"}</div></div>
      ${l.id===db.active?`<span class="tick">${ICON.check}</span>`:""}
      ${db.lists.length>1?`<button class="ldel" data-del="${l.id}">${ICON.trash}</button>`:""}
    </div>`);
    r.addEventListener("click",e=>{
      if(e.target.closest(".ldel")) return;
      db.active=l.id; save(); closeSheet(); renderList();
    });
    const d=r.querySelector(".ldel");
    if(d) d.addEventListener("click",e=>{
      e.stopPropagation();
      db.lists=db.lists.filter(x=>x.id!==l.id);
      if(db.active===l.id) db.active=db.lists[0].id;
      save(); closeSheet(); listsSheet();
    });
    wrap.appendChild(r);
  });
  node.querySelector("#newL").onclick=()=>{
    const l={id:uid(),name:"Grocery List",emoji:"🛒",items:[],created:Date.now()};
    db.lists.unshift(l); db.active=l.id; save(); closeSheet(); renderList();
    setTimeout(()=>{ const a=App().querySelector("#add"); a&&a.focus(); },360);
  };
  openSheet(node);
}

function emojiSheet(l){
  const node=el(`<div class="sheet"><div class="grab"></div>
    <h2>Pick a tag</h2><div class="sub">Just a little icon for this list.</div>
    <div class="emojirow">${EMOJIS.map(e=>`<button data-e="${e}" class="${e===l.emoji?'sel':''}">${e}</button>`).join("")}</div></div>`);
  node.querySelectorAll(".emojirow button").forEach(b=>b.onclick=()=>{ l.emoji=b.dataset.e; save(); closeSheet(); renderList(); });
  openSheet(node);
}

function menuSheet(l){
  const s=stats(l.items);
  const node=el(`<div class="sheet"><div class="grab"></div>
    <h2>${esc(l.name)}</h2><div class="sub">${s.t} item${s.t!==1?'s':''} · ${s.d} in cart</div>
    <div class="mrow" id="tg"><span class="mi">${ICON.aisle}</span>Sort by aisle<span class="grow"></span>
      <span class="toggle ${db.groupAisle?'on':''}"><i></i></span></div>
    ${s.d?`<button class="mrow" id="clr"><span class="mi">${ICON.broom}</span>Clear ${s.d} checked item${s.d>1?'s':''}</button>`:""}
    ${s.t?`<button class="mrow" id="unc"><span class="mi">${ICON.check}</span>Uncheck everything</button>`:""}
    <button class="mrow warn" id="del"><span class="mi">${ICON.trash}</span>${db.lists.length>1?"Delete this list":"Clear whole list"}</button>
  </div>`);
  node.querySelector("#tg").onclick=()=>{ db.groupAisle=!db.groupAisle; save();
    node.querySelector(".toggle").classList.toggle("on",db.groupAisle); renderList(); };
  const clr=node.querySelector("#clr"); if(clr) clr.onclick=()=>{ l.items=l.items.filter(i=>!i.done); save(); closeSheet(); renderList(); };
  const unc=node.querySelector("#unc"); if(unc) unc.onclick=()=>{ l.items.forEach(i=>i.done=false); save(); closeSheet(); renderList(); };
  node.querySelector("#del").onclick=()=>{
    if(db.lists.length>1){ db.lists=db.lists.filter(x=>x.id!==l.id); db.active=db.lists[0].id; }
    else { l.items=[]; }
    save(); closeSheet(); renderList();
  };
  openSheet(node);
}

/* ============================ toast ============================ */
const toastEl=document.getElementById("toast"); let toastT=null;
function toast(msg,label,action){
  clearTimeout(toastT);
  toastEl.innerHTML=`<span>${esc(msg)}</span>`+(label?`<button>${esc(label)}</button>`:"");
  if(label) toastEl.querySelector("button").onclick=()=>{ action&&action(); hideToast(); };
  toastEl.classList.add("on");
  toastT=setTimeout(hideToast,label?4200:1900);
}
function hideToast(){ toastEl.classList.remove("on"); }
function fallbackCopy(text){
  const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand("copy"); toast("Link copied ✓"); }catch(e){ toast("Couldn’t copy"); }
  ta.remove();
}

/* ============================ go ============================ */
window.addEventListener("hashchange",()=>{ if((location.hash||"").startsWith("#s=")) boot(); });
boot();
if("serviceWorker" in navigator){
  // Auto-pick-up new versions: when a freshly-installed SW takes control,
  // reload once so the user always sees the latest app (no stale page).
  const hadController = !!navigator.serviceWorker.controller;
  let refreshing = false;
  navigator.serviceWorker.addEventListener("controllerchange",()=>{
    if(!hadController || refreshing) return; refreshing=true; location.reload();
  });
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js").then(reg=>reg.update()).catch(()=>{});
  });
}
</script>
</body>
