<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Help</title>
<link rel="icon" href="favicon.png">
<style>
@font-face {
  font-family: 'Monocraft';
  src: url('vendor/Monocraft.ttc');
}
* { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --gui: #c6c6c6;
  --gui-dark: #555555;
  --gui-light: #ffffff;
  --slot: #8b8b8b;
}
html, body { height: 100%; }
body {
  font-family: 'Monocraft', monospace;
  background: #000;
  image-rendering: pixelated;
  color: #fff;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
img { image-rendering: pixelated; }

/* ------- header ------- */
header {
  background-image: url('tex/block/dirt.png');
  background-size: 64px 64px;
  border-bottom: 4px solid #3a2a17;
  padding: 10px 16px 0;
  flex-shrink: 0;
}
header h1 {
  font-size: 26px;
  text-shadow: 3px 3px 0 #3f3f3f;
  color: #ffff55;
  margin-bottom: 8px;
}
header h1 .grass { width: 30px; height: 30px; vertical-align: -4px; margin-right: 8px; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav button {
  font-family: inherit;
  font-size: 15px;
  padding: 8px 14px;
  cursor: pointer;
  color: #fff;
  background: #6f6f6f;
  border: 3px solid;
  border-color: #9a9a9a #2e2e2e #2e2e2e #9a9a9a;
  text-shadow: 2px 2px 0 #383838;
  border-bottom: none;
}
nav button.active {
  background: #8b8b8b;
  color: #ffff55;
}
nav button:hover { background: #7f7f7f; }

/* ------- main ------- */
main { flex: 1; overflow: hidden; position: relative; }
.tab { display: none; height: 100%; overflow-y: auto; padding: 18px; }
.tab.active { display: block; }
#tab-tutorials.active { display: flex; flex-direction: column; overflow: hidden; }

/* ------- MC panel look ------- */
.panel {
  background: var(--gui);
  border: 4px solid;
  border-color: var(--gui-light) var(--gui-dark) var(--gui-dark) var(--gui-light);
  color: #3f3f3f;
  padding: 14px;
  border-radius: 2px;
}
.panel h2 { color: #3f3f3f; font-size: 19px; margin-bottom: 8px; }
.panel h3 { color: #404040; }

/* ------- inventory slots ------- */
.slot {
  width: 48px; height: 48px;
  background: var(--slot);
  border: 3px solid;
  border-color: #373737 #fff #fff #373737;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  position: relative;
  cursor: pointer;
}
.slot img { width: 40px; height: 40px; }
.slot:hover { background: #a0a0a0; }
/* "missing texture" fallback tile (magenta/black checker, like in-game) */
.noicon {
  display: inline-flex; align-items: center; justify-content: center;
  width: 40px; height: 40px;
  background: repeating-conic-gradient(#f800f8 0% 25%, #000 0% 50%) 0 0 / 50% 50%;
  color: #fff; font-size: 12px; text-shadow: 1px 1px 0 #000;
  overflow: hidden;
}
.icons .slot .noicon { width: 32px; height: 32px; font-size: 10px; }
.slot .cnt {
  position: absolute; right: 1px; bottom: 0;
  font-size: 14px; color: #fff;
  text-shadow: 2px 2px 0 #3f3f3f;
  pointer-events: none;
}

/* ------- recipes tab ------- */
#tab-recipes.active { display: flex; gap: 18px; align-items: flex-start; overflow: hidden; }
#recipe-left { flex-shrink: 0; height: 100%; overflow-y: auto; }
#recipe-right { flex: 1; height: 100%; overflow-y: auto; }
#recipe-search {
  font-family: inherit; font-size: 17px;
  width: 100%; max-width: 560px;
  padding: 10px;
  background: #000; color: #fff;
  border: 3px solid;
  border-color: #a0a0a0 #fff #fff #a0a0a0;
  outline: none;
  margin-bottom: 12px;
}
#recipe-grid { display: flex; flex-wrap: wrap; gap: 4px; align-content: flex-start; }
#recipe-cats { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
#recipe-cats button {
  font-family: inherit; font-size: 13px; cursor: pointer;
  background: #6f6f6f; color: #fff; padding: 5px 9px;
  border: 3px solid; border-color: #9a9a9a #2e2e2e #2e2e2e #9a9a9a;
  text-shadow: 1px 1px 0 #383838;
}
#recipe-cats button.active { background: #4c7f36; color: #ffff55; border-color: #71b755 #2c4c1e #2c4c1e #71b755; }
#recipe-count { font-size: 13px; color: #aaa; margin-bottom: 8px; text-shadow: 1px 1px 0 #222; }
#recipe-view { margin-bottom: 16px; }
.craft-gui {
  position: relative;
  background-image: url('tex/gui/crafting_table.png');
  background-repeat: no-repeat;
  image-rendering: pixelated;
  flex-shrink: 0;
}
.craft-gui img.slot-item { position: absolute; }
.badge {
  display: inline-block; background: #575757; color: #ffff55;
  padding: 3px 8px; font-size: 13px; margin-left: 8px;
  text-shadow: 1px 1px 0 #222;
}
.ing-legend { margin-top: 10px; font-size: 15px; color: #3f3f3f; }
.ing-legend div { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
.ing-legend img { width: 24px; height: 24px; }

/* ------- guides ------- */
.chipbar {
  position: sticky; top: -18px; z-index: 5;
  display: flex; gap: 6px; flex-wrap: wrap;
  max-width: 900px; margin: -18px auto 14px;
  padding: 12px 0 10px;
  background: rgba(20,20,20,0.92);
}
.chipbar button {
  font-family: inherit; font-size: 13px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px;
  background: #6f6f6f; color: #fff;
  border: 3px solid; border-color: #9a9a9a #2e2e2e #2e2e2e #9a9a9a;
  padding: 6px 10px; text-shadow: 1px 1px 0 #383838;
}
.chipbar button img { width: 20px; height: 20px; }
.chipbar button:hover { background: #4c7f36; color: #ffff55; }
.guide-section { max-width: 900px; margin: 0 auto 18px; }
.guide-section h2 { display: flex; align-items: center; gap: 10px; }
.guide-section h2 img { width: 32px; height: 32px; }
.step { display: flex; gap: 12px; margin: 10px 0; align-items: flex-start; }
.step .num {
  flex-shrink: 0;
  width: 34px; height: 34px;
  background: #4c7f36; color: #fff;
  border: 3px solid; border-color: #71b755 #2c4c1e #2c4c1e #71b755;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
}
.step p { font-size: 15px; line-height: 1.55; color: #333; }
.step .icons { display: flex; gap: 2px; margin-top: 6px; flex-wrap: wrap; }
.step .icons .slot { width: 40px; height: 40px; }
.step .icons .slot img { width: 32px; height: 32px; }
.ednote { color: #7a3fbf; font-size: 13.5px; display: block; margin-top: 4px; }
/* copyable command lines */
.cmdline {
  display: flex; align-items: center; gap: 8px;
  background: #111; color: #7fff7f;
  border: 2px solid #444;
  padding: 7px 10px; margin: 5px 0;
  font-size: 14px;
  max-width: 640px;
  overflow-x: auto;
}
.cmdline code { flex: 1; white-space: nowrap; }
.copybtn {
  font-family: inherit; font-size: 12px; cursor: pointer; flex-shrink: 0;
  background: #4c7f36; color: #fff; padding: 4px 8px;
  border: 2px solid; border-color: #71b755 #2c4c1e #2c4c1e #71b755;
}
.copybtn:active { border-color: #2c4c1e #71b755 #71b755 #2c4c1e; }
.bubble pre { position: relative; padding-right: 62px; }
.bubble pre .copybtn { position: absolute; top: 6px; right: 6px; }
.tipnote { color: #1f6b1f; font-size: 13.5px; display: block; margin-top: 4px; }

/* ------- tutorials ("videos") ------- */
#tut-bar { display: flex; gap: 8px; padding: 12px 16px; flex-wrap: wrap; flex-shrink: 0; }
#tut-bar button {
  font-family: inherit; font-size: 14px;
  padding: 8px 12px; cursor: pointer;
  background: #6f6f6f; color: #fff;
  border: 3px solid; border-color: #9a9a9a #2e2e2e #2e2e2e #9a9a9a;
  text-shadow: 2px 2px 0 #383838;
}
#tut-bar button.active { background: #4c7f36; color: #ffff55; border-color: #71b755 #2c4c1e #2c4c1e #71b755; }
#tut-materials {
  display: flex; gap: 4px; flex-wrap: wrap; align-items: center;
  padding: 0 16px 10px; flex-shrink: 0;
}
#tut-materials .mat {
  position: relative; width: 40px; height: 40px;
  background: rgba(0,0,0,0.55); border: 3px solid #555;
  display: inline-flex; align-items: center; justify-content: center;
}
#tut-materials .mat img { width: 30px; height: 30px; }
#tut-materials .mat .cnt {
  position: absolute; right: 0; bottom: -1px;
  font-size: 12px; color: #fff; text-shadow: 1px 1px 0 #000;
}
#tut-materials .mat-label { font-size: 13px; color: #ffff55; text-shadow: 1px 1px 0 #222; margin-right: 6px; }
#tut-stage { flex: 1; position: relative; min-height: 0; margin: 0 16px; border: 4px solid; border-color: #fff #555 #555 #fff; }
#tut-canvas-holder { position: absolute; inset: 0; }
#tut-caption {
  position: absolute; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.72);
  color: #fff; font-size: 17px;
  padding: 12px 16px;
  text-shadow: 2px 2px 0 #222;
  min-height: 52px;
}
#tut-caption .stepno { color: #ffff55; margin-right: 10px; }
#tut-caption .ed { color: #d5a6ff; font-size: 14px; display: block; margin-top: 4px; }
#tut-controls {
  flex-shrink: 0;
  display: flex; align-items: center; gap: 10px;
  padding: 12px 16px 16px;
}
#tut-controls button {
  font-family: inherit; font-size: 18px;
  width: 52px; height: 44px; cursor: pointer;
  background: var(--gui); color: #3f3f3f;
  border: 3px solid; border-color: #fff #555 #555 #fff;
}
#tut-controls button:active { border-color: #555 #fff #fff #555; }
#tut-scrub { flex: 1; accent-color: #4c7f36; height: 20px; cursor: pointer; }
#tut-progress { font-size: 15px; min-width: 90px; text-align: right; text-shadow: 2px 2px 0 #222; }

/* ------- chat ------- */
#tab-chat.active { display: flex; flex-direction: column; overflow: hidden; }
#chat-log { flex: 1; overflow-y: auto; padding: 6px 2px; max-width: 900px; width: 100%; margin: 0 auto; }
.msg { margin: 10px 0; display: flex; gap: 10px; }
.msg .avatar { width: 40px; height: 40px; flex-shrink: 0; border: 3px solid #222; }
.msg .bubble {
  background: var(--gui); color: #333;
  border: 4px solid; border-color: #fff #555 #555 #fff;
  padding: 10px 14px; font-size: 15px; line-height: 1.6;
  max-width: 85%;
  overflow-wrap: break-word;
}
.msg.user { flex-direction: row-reverse; }
.msg.user .bubble { background: #4c7f36; color: #fff; border-color: #71b755 #2c4c1e #2c4c1e #71b755; }
.bubble p { margin: 4px 0; }
.bubble ul, .bubble ol { margin: 4px 0 4px 22px; }
.bubble code { background: #2b2b2b; color: #7fff7f; padding: 1px 5px; font-size: 13.5px; }
.bubble pre { background: #2b2b2b; color: #7fff7f; padding: 8px; margin: 6px 0; overflow-x: auto; font-size: 13.5px; }
#chat-form { display: flex; gap: 8px; max-width: 900px; width: 100%; margin: 10px auto 0; flex-shrink: 0; }
#chat-input {
  flex: 1; font-family: inherit; font-size: 16px;
  padding: 12px; background: #000; color: #fff;
  border: 3px solid; border-color: #a0a0a0 #fff #fff #a0a0a0;
  outline: none;
}
#chat-send {
  font-family: inherit; font-size: 16px; padding: 0 22px; cursor: pointer;
  background: #4c7f36; color: #fff;
  border: 3px solid; border-color: #71b755 #2c4c1e #2c4c1e #71b755;
  text-shadow: 2px 2px 0 #2c4c1e;
}
.suggestions { display: flex; gap: 6px; flex-wrap: wrap; max-width: 900px; margin: 8px auto 0; }
.suggestions button {
  font-family: inherit; font-size: 13px; cursor: pointer;
  background: rgba(0,0,0,0.55); color: #aaa;
  border: 2px solid #555; padding: 6px 10px;
}
.suggestions button:hover { color: #ffff55; border-color: #999; }

.thinking { color: #555; }
.thinking .dots::after {
  content: '';
  animation: dots 1.2s steps(4) infinite;
}
@keyframes dots { 0% { content: ''; } 25% { content: '.'; } 50% { content: '..'; } 75% { content: '...'; } }

/* small screens: stack the recipe columns, tighten the header */
@media (max-width: 900px) {
  #tab-recipes.active { flex-direction: column; }
  #recipe-left, #recipe-right { height: auto; overflow: visible; width: 100%; }
  #tab-recipes { overflow-y: auto !important; }
  header h1 { font-size: 20px; }
  nav button { font-size: 13px; padding: 6px 9px; }
  .craft-gui { max-width: 100%; }
  #tut-controls { flex-wrap: wrap; }
}

::-webkit-scrollbar { width: 14px; }
::-webkit-scrollbar-track { background: #2b2b2b; }
::-webkit-scrollbar-thumb { background: #8b8b8b; border: 3px solid #2b2b2b; }
</style>
</head>
<body>
<header>
  <h1><img class="grass" src="tex/block/grass_block_side.png" alt=""> Minecraft Help</h1>
  <nav>
    <button data-tab="recipes" class="active">⛏ Recipes</button>
    <button data-tab="survival">🧭 Survival Guide</button>
    <button data-tab="redstone">🟥 Redstone</button>
    <button data-tab="commands">⌨ Commands</button>
    <button data-tab="tutorials">▶ Build Tutorials</button>
    <button data-tab="chat">🤖 Ask AI</button>
  </nav>
</header>
<main>
  <div class="tab active" id="tab-recipes">
    <div id="recipe-left">
      <div id="recipe-view"></div>
    </div>
    <div id="recipe-right">
      <input id="recipe-search" type="text" placeholder="Search any item... (sword, torch, bed)">
      <div id="recipe-cats"></div>
      <div id="recipe-count"></div>
      <div id="recipe-grid"></div>
    </div>
  </div>
  <div class="tab" id="tab-survival"></div>
  <div class="tab" id="tab-redstone"></div>
  <div class="tab" id="tab-commands"></div>
  <div class="tab" id="tab-tutorials">
    <div id="tut-bar"></div>
    <div id="tut-materials"></div>
    <div id="tut-stage">
      <div id="tut-canvas-holder"></div>
      <div id="tut-caption"></div>
    </div>
    <div id="tut-controls">
      <button id="tut-play" title="Play">▶</button>
      <button id="tut-prev" title="Back">⏮</button>
      <button id="tut-next" title="Next">⏭</button>
      <button id="tut-speed" title="Playback speed" style="width:auto;padding:0 10px;font-size:14px">1x</button>
      <button id="tut-view" title="Reset camera" style="font-size:15px">🎥</button>
      <button id="tut-sound" title="Sound on/off" style="font-size:15px">🔊</button>
      <a id="tut-yt" target="_blank" title="Watch real video tutorials on YouTube"
         style="font-family:inherit;font-size:14px;padding:10px 12px;cursor:pointer;background:#a12d2d;color:#fff;border:3px solid;border-color:#d05353 #5e1717 #5e1717 #d05353;text-decoration:none;text-shadow:1px 1px 0 #5e1717;white-space:nowrap">🎬 Real Videos</a>
      <input id="tut-scrub" type="range" min="0" max="10" value="0" step="1">
      <div id="tut-progress">0 / 0</div>
    </div>
  </div>
  <div class="tab" id="tab-chat">
    <div id="chat-log"></div>
    <div class="suggestions" id="chat-suggestions"></div>
    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="Ask anything about Minecraft..." autocomplete="off">
      <button id="chat-send" type="submit">Send</button>
    </form>
  </div>
</main>
<script src="data.js"></script>
<script src="getinfo.js"></script>
<script src="guides.js"></script>
<script src="app.js"></script>
<script type="module" src="farms.js"></script>
</body>
</html>
