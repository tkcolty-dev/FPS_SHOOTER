<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scratch Together</title>
<link rel="icon" href="/favicon.svg">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #e5f0ff; }
  #app { position: absolute; inset: 0; }
  #together-pill {
    position: fixed; top: 6px; right: 12px; z-index: 9999;
    font: 12px/1.3 "Helvetica Neue", Helvetica, Arial, sans-serif; color: #fff;
    background: rgba(31, 41, 55, .92); border-radius: 12px; padding: 6px 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,.25); max-width: 260px; backdrop-filter: blur(6px);
  }
  #together-pill .tg-head { display: flex; align-items: center; gap: 8px; }
  #together-pill .tg-code { font-weight: 700; letter-spacing: .12em; font-size: 13px; }
  #together-pill .tg-copy { border: 0; border-radius: 8px; padding: 3px 8px; cursor: pointer;
    background: #4c97ff; color: #fff; font-size: 11px; font-weight: 600; }
  #together-pill .tg-copy:hover { background: #3373cc; }
  #together-pill .tg-count { margin-left: auto; opacity: .9; }
  #together-pill .tg-status { color: #ffd166; font-weight: 600; }
  #together-pill .tg-list { display: none; margin-top: 6px; border-top: 1px solid rgba(255,255,255,.15); padding-top: 6px; }
  #together-pill:hover .tg-list { display: block; }
  #together-pill.tg-open { max-width: 320px; }
  #together-pill .tg-gear { border: 0; background: transparent; color: #fff; cursor: pointer; font-size: 14px; padding: 0 2px; opacity: .85; }
  #together-pill .tg-gear:hover { opacity: 1; }
  #together-pill .tg-cloud { margin-top: 6px; font-size: 11px; opacity: .8; }
  #together-pill .tg-settings { margin-top: 8px; border-top: 1px solid rgba(255,255,255,.15); padding-top: 8px; }
  #together-pill .tg-label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; opacity: .7; margin: 8px 0 4px; }
  #together-pill .tg-row { display: flex; gap: 6px; align-items: center; }
  #together-pill .tg-input { flex: 1; min-width: 0; padding: 5px 7px; border-radius: 7px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.1); color: #fff; font: inherit; }
  #together-pill .tg-btn { border: 0; border-radius: 7px; padding: 5px 9px; background: #4c97ff; color: #fff; font-weight: 600; cursor: pointer; font: inherit; }
  #together-pill .tg-modes label { display: block; padding: 3px 0; cursor: pointer; }
  #together-pill .tg-modes input { margin: 0 6px 0 0; }
  #together-pill .tg-link { color: #9cc7ff; text-decoration: none; display: inline-block; margin-top: 6px; }
  #together-pill .tg-foot { justify-content: space-between; margin-top: 4px; }
  #together-pill .tg-user { display: flex; align-items: center; gap: 6px; padding: 2px 0; }
  #together-pill .tg-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  #together-pill .tg-name { font-weight: 600; }
  #together-pill .tg-sprite { margin-left: auto; opacity: .7; font-size: 11px; }
  #together-pill .tg-credit { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255,255,255,.15); font-size: 10px; opacity: .7; }
  #together-pill .tg-credit a { color: #9cc7ff; }
</style>
</head>
<body>
<div id="app"></div>
<script src="/vendor/react.js"></script>
<script src="/vendor/react-dom.js"></script>
<script>window.react = window.React; window["react-dom"] = window.ReactDOM;</script>
<script src="/gui/scratch-gui.js"></script>
<script src="/collab.js"></script>
</body>
</html>
